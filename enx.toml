# enx project configuration
    # Example: name = "my-app"
    # Example: steps = ["cmd1", "cmd2"]
    # Example: [tasks.test]

[project]
# display name shown in `enx projects`
name = "starshot-benchmark"

# [env] maps environment name -> dotenv file path.
# `enx env <name>` looks up the name here and loads that file.
[env]
# dev = ".env"
# staging = ".env.staging"

# [up] uses a list of shell commands run by `enx up`.
[up]
steps = [
    # "npm install",
    # "docker compose up -d",
    "cd server && uv sync",
]

# [down] uses a list of shell commands run by `enx down`.
[down]
steps = [
    # "docker compose down",
]

# [start] uses a list of shell commands run by `enx start`.
[start]
commands = [
    # "npm run dev",
]

# [tasks] must use nested tables per task.
# valid:
#   [tasks.test]
#   command = "npm test"
#   description = "Run tests"
#
# invalid (will fail to parse):
#   [tasks]
#   test = "npm test"
#
# If the task name contains special characters (like ':'), quote the table key:
# [tasks."db:migrate"]
# command = "npx prisma migrate dev"
[tasks.test]
command = "uv run --script scripts/run_request.py"
description = "Run test suite"

[tasks.playground]
command = "uv run --script scripts/run_playground.py"
description = "Boot the prompt → Nano Banana → Trellis 2 dev playground"

[tasks."modal:up"]
command = "uv run --project server modal deploy splat/modal_app.py"
description = "Deploy/refresh the Modal splat trainer — run before a training session (and after code changes)"

[tasks."modal:down"]
command = "uv run --project server modal app stop starshot-splat -y"
description = "Stop the Modal splat app (terminates any running container). Optional — idle costs nothing"

[tasks."modal:probe"]
command = "uv run --project server modal run splat/modal_app.py::probe_webgl"
description = "Check the A100's headless-WebGL renderer (GPU vs SwiftShader) — run once before trusting stage 5"

[tasks."modal:probe-gpu"]
command = "uv run --project server modal run splat/modal_app.py::probe_gpu_stack"
description = "Inventory the A100 container's graphics stack (driver, Vulkan ICDs, NVIDIA GL libs) to see if hardware WebGL is reachable"

[tasks."modal:logs"]
command = "uv run --project server modal app logs starshot-splat"
description = "Fetch recent logs from the Modal splat app (append -f manually to live-stream)"

[tasks."modal:status"]
command = "uv run --project server modal app list"
description = "List Modal apps — see whether starshot-splat is deployed / running / stopped"

# Both take a cell directory, its splat/, or the trained.ply itself, resolved from the
# repo root: `enx run splat:fit runs/<run>/<slot>/<model>`. They read cloud.ply beside
# the trained model, so a cell missing its stage-3 cloud will say so rather than guess.
[tasks."splat:fit"]
command = "node client/tools/fit-splat-transform.mjs"
description = "Solve a trained splat's world placement against its init cloud, and report whether it is trustworthy — read-only, writes nothing"

[tasks."splat:web"]
command = "node client/tools/splat-to-web-sog.mjs"
description = "Encode trained splat(s) into web-sized .web.sog beside each input. Add --fit to solve and bake the placement in one pass, --dry-run to see the plan first"

[tasks."prod:server"]
command = "cd server && uv run uvicorn app.main:app --port 8765"
description = "Run production server."

[tasks."prod:client"]
command = "cd prod_client && bun dev"
description = "Run production client."
# [open] maps target name -> URL or shell command for `enx open <target>`.
[open]
repo = "https://github.com/enxilium/starshot-benchmark"
# code = "code ."
# docs = "https://docs.example.com"

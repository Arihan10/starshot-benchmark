[project]
name = "starshot-benchmark-server"
version = "0.1.0"
description = "Orchestrator server for text-to-3D scene pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "trimesh>=4.5",
    "numpy>=2.0",
    "rich>=13.9",
    "runware>=0.5.9",
    "fal-client>=0.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "openrouter>=0.9.1",
    "google-genai>=1.0",
    "scipy>=1.18.0",
    "modal>=1.5.2",
    "zstandard>=0.23 ; python_full_version < '3.14'",
    # splat/assets.py: in-process EXT_meshopt_compression decode (no de-opt step)
    "meshoptimizer>=0.2.20",
    # splat/assets.py: runs the vendored Basis Universal KTX2 transcoder
    # (splat/vendor/*.wasm) — pure-Python wheels on Windows/macOS/Linux.
    "wasmtime>=46.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.389",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="server-url" content="http://127.0.0.1:8765" />
		<title>attention inspector · starshot</title>
		<style>
			:root {
				--bg: #0c0d10;
				--panel: #121319;
				--panel-2: #16181f;
				--panel-3: #1b1e26;
				--line: #23252c;
				--line-2: #2c2f38;
				--text: #d7dae0;
				--text-dim: #8a8f99;
				--text-faint: #626772;
				--accent: #7aa2f7;
				--zone: #ff6b6b;
				--object: #6bd96e;
				--frame: #7fb3d5;
				--toplace: #e0a94a;
				--output: #b46aff;
				--variable: #4af0e0;
			}
			* { box-sizing: border-box; }
			html, body {
				margin: 0; height: 100%;
				background: var(--bg); color: var(--text);
				font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			button, select, input {
				font: inherit; color: var(--text);
				background: var(--panel-2); border: 1px solid var(--line-2);
				border-radius: 6px; padding: 4px 8px; cursor: pointer;
			}
			button:hover:not(:disabled), select:hover { border-color: var(--accent); }
			button:disabled, select:disabled { opacity: 0.4; cursor: default; }
			.muted { color: var(--text-dim); }
			.faint { color: var(--text-faint); }
			::-webkit-scrollbar { width: 10px; height: 10px; }
			::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; }
			::-webkit-scrollbar-thumb:hover { background: #3a3e49; }

			#app { display: flex; flex-direction: column; height: 100vh; position: relative; }

			/* thin top loading strip */
			#dv-loading { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 50; overflow: hidden; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
			#dv-loading.on { opacity: 1; }
			#dv-loading > i { position: absolute; inset: 0; width: 32%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: dv-buffer 1.1s ease-in-out infinite; }
			@keyframes dv-buffer { 0% { left: -32%; } 100% { left: 100%; } }

			/* --- header / nav --- */
			#top {
				display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
				padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
			}
			.brand { font-weight: 700; letter-spacing: 0.02em; flex: none; }
			.brand .sub { color: var(--text-dim); font-weight: 400; margin-left: 6px; font-size: 12px; }
			.sep { width: 1px; height: 22px; background: var(--line-2); flex: none; }
			#top label { color: var(--text-dim); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
			#top select { max-width: 230px; }
			.spacer { flex: 1; }
			.pill { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12px; text-decoration: none; color: var(--text-dim); }
			a.pill:hover { border-color: var(--accent); color: var(--text); }
			/* when embedded in the /tf viewer's workspace modal, the parent already
			   provides dashboard/legacy navigation + a close button */
			body.embedded #top a.pill { display: none; }

			/* data / ablation view toggle */
			.viewtog { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; gap: 2px; }
			.viewtog button { border: none; background: transparent; border-radius: 6px; padding: 5px 12px; color: var(--text-dim); font-size: 12px; }
			.viewtog button.on { background: #22304f; color: #cfe3ff; box-shadow: inset 0 0 0 1px rgba(122,162,247,0.35); }

			/* selection scope line */
			#scope {
				display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
				padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2);
				font-size: 12px; color: var(--text-dim);
			}
			#scope b { color: var(--text); font-weight: 600; }
			#scope .chip { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel); font-variant-numeric: tabular-nums; }
			#scope .chip.warn { color: #f0b968; border-color: #7a5a1f; }

			/* --- main scroll --- */
			#dv { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 18px; }
			/* fill the available page width (no centered cap) so charts get real room */
			.dv-inner { max-width: none; width: 100%; margin: 0; display: flex; flex-direction: column; gap: 16px; }
			.dv-row { display: grid; grid-template-columns: minmax(300px, 30%) minmax(0, 1fr); gap: 16px; align-items: stretch; }
			@media (max-width: 900px) { .dv-row { grid-template-columns: 1fr; } }
			.dv-cards { display: flex; flex-direction: column; gap: 16px; }
			/* last-N step window (whole scene / step-kind / region selections) — drives every card */
			.dv-window { display: flex; align-items: center; gap: 10px; flex: none; }
			.dv-win-cap { flex: none; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
			.dv-win-slider { flex: 1 1 auto; max-width: 360px; accent-color: var(--accent); }
			.dv-win-lab { flex: none; font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
			.dv-win-scope { flex: none; font-size: 11.5px; color: var(--text-faint); font-family: ui-monospace, Menlo, monospace; }

			/* cards */
			.card {
				background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
				padding: 15px 17px 17px; min-width: 0; display: flex; flex-direction: column;
			}
			.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; min-width: 0; }
			.card-title { font-weight: 700; font-size: 15px; }
			.card-sub { color: var(--text-faint); font-size: 12px; margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.card-body { min-width: 0; flex: 1 1 auto; }

			/* two-up (pie + scatter) */
			.split { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); gap: 18px; align-items: center; }
			@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }

			/* spider / attr legend (shared with charts.js output) */
			.attr-radial-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center; }
			.attr-radial { display: block; margin: 0 auto; height: auto; }
			.attr-axis-legend { display: flex; flex-wrap: wrap; gap: 7px 9px; justify-content: center; margin-top: 6px; }
			.axis-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 10px; }
			.axis-pill i { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
			.axis-pill b { color: var(--text); font-weight: 700; font-family: ui-monospace, Menlo, monospace; }

			/* chart wrap + svg — SVGs are sized in real px by charts.js (mountChart),
			   so DON'T let CSS re-stretch them (that would ignore the chosen height). */
			.gwrap { position: relative; width: 100%; }
			.gsvg { display: block; overflow: visible; max-width: 100%; }
			.chart-host { width: 100%; }
			.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--text-dim); align-items: center; justify-content: center; }
			.chart-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
			.chart-legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
			.chart-legend .lg.clickable { cursor: pointer; padding: 1px 6px; border-radius: 999px; border: 1px solid transparent; }
			.chart-legend .lg.clickable:hover { border-color: var(--line-2); }
			.chart-legend .lg.off { opacity: 0.4; }

			/* crosshair tooltip (line/area/scatter) */
			.graph-tip { position: absolute; z-index: 20; pointer-events: none; background: rgba(16,18,24,0.97); border: 1px solid var(--line-2); border-radius: 7px; padding: 7px 10px; font-size: 12.5px; color: var(--text); box-shadow: 0 8px 26px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.08s; min-width: 96px; }
			.graph-tip .xh { color: var(--text-faint); font-size: 11px; margin-bottom: 3px; }
			.graph-tip .r { display: flex; justify-content: space-between; gap: 14px; line-height: 1.55; }
			.graph-tip .r .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
			.graph-tip b { font-variant-numeric: tabular-nums; }

			/* pie */
			.pie-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
			.pie-svg { display: block; height: auto; max-width: 100%; }
			/* composition toolbar (reasoning / output / both segmented control) */
			.comp-toolbar { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; flex-wrap: wrap; }
			.seg-ctl { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; gap: 2px; }
			.seg-btn { border: none; background: transparent; border-radius: 6px; padding: 5px 13px; color: var(--text-dim); font-size: 12.5px; cursor: pointer; }
			.seg-btn:hover { color: var(--text); }
			.seg-btn.on { background: #22304f; color: #cfe3ff; box-shadow: inset 0 0 0 1px rgba(122,162,247,0.35); }
			/* scatter caption row (holds the log-y toggle) */
			.scatter-cap { display: flex; align-items: center; gap: 10px; margin: 0 0 6px 2px; font-size: 12px; }
			.scatter-cap .muted { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.mini-toggle { font-size: 11px; padding: 3px 10px; border-radius: 999px; flex: none; }
			.mini-toggle.on { background: #22304f; border-color: var(--accent); color: #cfe3ff; }
			.pie-slice { cursor: pointer; transition: opacity 0.12s; }
			.pie-slice.dim { opacity: 0.28; }
			.pie-legend { display: flex; flex-direction: column; gap: 4px; width: 100%; font-size: 12px; }
			.pie-legend .row { display: flex; align-items: center; gap: 7px; padding: 2px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
			.pie-legend .row:hover { background: var(--panel-2); }
			.pie-legend .row.active { border-color: var(--accent); background: #17243b; }
			.pie-legend .row.dim { opacity: 0.42; }
			.pie-legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
			.pie-legend .nm { flex: 1; }
			.pie-legend .val { color: var(--text-dim); font-variant-numeric: tabular-nums; }

			/* output bins */
			.out-svg { display: block; }
			.out-hint { font-size: 11px; color: var(--text-faint); margin-top: 7px; }
			/* hovering a bin fisheye-enlarges it (JS) so the attribute sub-bins become
			   readable; the hovered sub-bin gets a white outline (the "special
			   highlight") and its exact value shows in a native tooltip. */
			.out-bin { cursor: pointer; }
			.out-seg { transition: filter 0.1s; }
			.out-bin:hover .out-seg { filter: brightness(1.1); }
			.out-seg:hover { filter: brightness(1.55); stroke: #fff; stroke-width: 1.5; }
			.out-seg-lab { pointer-events: none; }
			.out-name { fill: rgba(220,230,245,0.5); transition: fill 0.1s; }
			.out-bin:hover .out-name, .out-bin.foc .out-name { fill: #cfe3ff; }
			/* pinned per-object attribute breakdown (drill-down) */
			.out-detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
			.out-detail-hint { color: var(--text-faint); font-size: 12px; }
			.od-head { font-size: 13px; margin-bottom: 6px; }
			.od-head b { color: var(--text); font-family: ui-monospace, Menlo, monospace; }
			.od-sub { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 10px 0 5px; }
			.od-bars { display: flex; flex-direction: column; gap: 4px; }
			.od-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
			.od-sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
			.od-nm { flex: 0 0 30%; font-family: ui-monospace, Menlo, monospace; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.od-bar { flex: 1; height: 9px; background: #0a0b0e; border-radius: 3px; overflow: hidden; }
			.od-bar i { display: block; height: 100%; border-radius: 3px; }
			.od-val { flex: none; min-width: 96px; text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }

			/* VII per-instruction attention (attention-saving) */
			.vii-hint { font-size: 11px; color: var(--text-faint); margin-top: 9px; line-height: 1.5; }
			/* VII instruction search (highlights matching dots on the scatter) */
			.vii-searchbar { display: flex; align-items: center; gap: 8px; margin: 2px 2px 10px; }
			.vii-search-ico { color: var(--text-faint); flex: none; }
			.vii-search { flex: 1 1 auto; min-width: 0; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 10px; color: var(--text); font-size: 12.5px; outline: none; }
			.vii-search:focus { border-color: var(--accent); }
			.vii-search::placeholder { color: var(--text-faint); }
			.vii-search-n { flex: none; font-size: 11.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
			/* scatter hover tooltip — let the instruction sentence wrap */
			.graph-tip.scatter-tip { max-width: 360px; }
			.graph-tip .tip-trend { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
			.graph-tip .tip-trend .below { color: #39d98a; }
			.graph-tip .tip-sentence { margin-top: 5px; white-space: normal; line-height: 1.4; color: var(--text); font-size: 12px; }
			/* square VII scatter, centered in its grid column */
			.vii-plot-host .gwrap { display: flex; justify-content: center; }
			/* shared step-kind legend (decodes the dot colors + each ranked row's left bar) */
			.vii-legend { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 10px; margin: 6px 2px 2px; }
			.vii-legend-lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
			.vii-legend .chart-legend { margin-top: 0; }
			/* VII: scatter (left) + ranked list (right) */
			.vii-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); gap: 16px; align-items: start; }
			@media (max-width: 760px) { .vii-main { grid-template-columns: 1fr; } }
			.vii-rank { border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel-2); display: flex; flex-direction: column; max-height: 62vh; overflow: hidden; }
			.vii-rank-head { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); padding: 8px 10px; border-bottom: 1px solid var(--line); flex: none; }
			.vii-rank-list { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
			.vii-rk { display: grid; grid-template-columns: 20px 44px 1fr; gap: 8px; align-items: baseline; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 5px 8px; color: var(--text); cursor: pointer; font: inherit; width: 100%; }
			.vii-rk:hover { background: #17243b; }
			.vii-rk.on { border-color: var(--accent); background: #17243b; }
			.vii-rk.pick { background: rgba(57,217,138,0.08); }
			.vii-rk-n { color: var(--text-faint); font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
			.vii-rk-z { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--text-dim); }
			.vii-rk-z.pos { color: #39d98a; font-weight: 600; }
			.vii-rk-txt { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.42; -webkit-user-select: text; user-select: text; cursor: text; }
			/* hover or click (select) a row to reveal the full instruction — text wraps, the row grows */
			.vii-rk:hover .vii-rk-txt, .vii-rk.on .vii-rk-txt { overflow: visible; white-space: normal; overflow-wrap: anywhere; }
			.vii-report-btn { flex: none; background: #22304f; border: 1px solid var(--line-2); color: #cfe3ff; border-radius: 7px; padding: 6px 11px; font-size: 12px; cursor: pointer; white-space: nowrap; }
			.vii-report-btn:hover { border-color: var(--accent); }
			.vii-report-btn:disabled { opacity: 0.6; cursor: default; }
			.od-ents { display: flex; flex-wrap: wrap; gap: 5px; }
			.od-ent { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 9px; }
			.od-ent-sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }

			.empty { color: var(--text-faint); padding: 40px 16px; text-align: center; line-height: 1.7; }
			.empty .big { display: block; font-size: 26px; margin-bottom: 8px; opacity: 0.6; }
			.card .empty { padding: 26px 12px; }

			/* view containers: data shows by default (hidden via .off); ablation +
			   content are hidden until toggled on. Only one is visible at a time. */
			#ablation-view { display: none; }
			#ablation-view.on { display: block; }
			#content-view { display: none; }
			#content-view.on { display: block; }
			#data-view.off { display: none; }

			/* per-step prompt viewer popup */
			.pv-overlay { position: fixed; inset: 0; z-index: 90; background: rgba(6,7,10,0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 4vh 4vw; }
			.pv-panel { display: flex; flex-direction: column; width: min(1000px, 96vw); max-height: 92vh; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); overflow: hidden; }
			.pv-head { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
			.pv-title { font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
			.pv-meta { font-size: 12px; color: var(--text-dim); font-family: ui-monospace, Menlo, monospace; }
			.pv-close { padding: 4px 10px; }
			.pv-scroll { overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; }
			.pv-empty { padding: 40px; text-align: center; color: var(--text-faint); }
			.pv-sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
			.pv-sec-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); font-weight: 600; }
			.pv-sec-meta { font-size: 11px; color: var(--text-faint); }
			.pv-sec-body { background: #0a0b0e; border: 1px solid var(--line); border-radius: 8px; max-height: 40vh; overflow: auto; }
			.pv-pre { margin: 0; padding: 11px 13px; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.6 ui-monospace, Menlo, monospace; color: var(--text); }

			/* ablation view */
			.abl-toolbar { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; margin: 0 0 2px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
			.abl-tool-grp { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); }
			.abl-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--text-dim); }
			.abl-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
			.abl-legend .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
			.abl-note { margin: 0 0 2px; font-size: 12px; }
			/* ablation determinate loading bar */
			.abl-loading { max-width: 520px; margin: 48px auto; text-align: center; }
			.abl-progress-label { color: var(--text-dim); font-size: 13px; margin-bottom: 10px; }
			.abl-progress { height: 6px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
			.abl-progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.2s ease; }

			/* --- content view (the per-step "structure" page: 3D · tree · plan/output/reasoning) --- */
			.ct-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 4px; font-size: 12px; color: var(--text-dim); }
			.ct-btn { font-size: 12px; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text-dim); cursor: pointer; }
			.ct-btn:hover { color: var(--text); border-color: var(--accent); }
			/* 3D viewer card host */
			.ct-3d-card .card-body { padding: 0; }
			.ct-canvas-host { position: relative; width: 100%; height: min(56vh, 560px); background: #0a0b0e; border-radius: 8px; overflow: hidden; }
			.ct-canvas-host canvas { display: block; }
			.ct-3d-controls { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 10px 2px 2px; font-size: 12px; color: var(--text-dim); }
			.ct-3d-legend { display: inline-flex; align-items: center; gap: 8px; }
			.ct-3d-bar { width: 100px; height: 10px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.15); background: linear-gradient(to right, hsl(209,90%,55%), hsl(58,90%,55%)); }
			.ct-minw { display: inline-flex; align-items: center; gap: 7px; }
			.ct-minw input { width: 110px; accent-color: var(--accent); }
			.ct-minw-lab { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
			.ct-kind { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; font-size: 11px; color: var(--text-faint); background: transparent; border: 1px solid var(--line-2); text-transform: capitalize; opacity: 0.55; cursor: pointer; }
			.ct-kind.on { color: var(--text); opacity: 1; background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.3); }
			.ct-kind i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

			/* zone plan / output / reasoning */
			.ct-plan-lab { display: flex; align-items: center; gap: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 0 0 5px; }
			.ct-plan-lab .sw { width: 9px; height: 9px; border-radius: 2px; }
			.ct-plan-clamp { max-height: 8.4em; overflow: hidden; font-size: 13px; line-height: 1.55; color: var(--text); }
			.ct-plan-clamp.expanded { max-height: none; }
			.ct-plan-toggle { margin-top: 5px; font-size: 11px; padding: 2px 9px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text-dim); cursor: pointer; }
			.ct-plan-toggle:hover { color: var(--text); border-color: var(--accent); }
			.ct-out { margin-top: 14px; }
			.ct-code { background: #0a0b0e; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: 300px; overflow: auto; }
			.ct-code pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 ui-monospace, Menlo, monospace; color: var(--text); }
			/* entity mention span (plan prose + output/reasoning) — underline = attention heat */
			.ct-ent { border-radius: 2px; padding: 0 1px; cursor: pointer; transition: filter 0.1s, box-shadow 0.1s; }
			.ct-ent:hover, .ct-ent.hot { filter: brightness(1.3); box-shadow: 0 0 0 1px rgba(122,162,247,0.6), 0 0 8px rgba(122,162,247,0.45); }
			.ct-attr { font-weight: 600; }

			/* attention tree (badge tree — width + heat) */
			.ct-tree { display: flex; flex-direction: column; gap: 20px; }
			.ct-tree-cap { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-bottom: 6px; }
			.ct-tree-view { display: flex; flex-direction: column; gap: 3px; overflow-x: hidden; position: relative; }
			.ct-row { display: flex; align-items: stretch; gap: 2px; min-height: 22px; }
			.ct-badge { flex: none; min-width: 3px; height: 22px; box-sizing: border-box; border: 1px solid; border-radius: 4px; overflow: hidden; display: flex; align-items: center; padding: 0 6px; cursor: pointer; font-size: 10.5px; color: var(--text); white-space: nowrap; transition: filter 0.1s; }
			.ct-badge.zone { font-weight: 600; height: 24px; }
			.ct-badge.root { border-style: dashed; font-weight: 600; }
			.ct-badge:hover { filter: brightness(1.5); outline: 1px solid rgba(255,255,255,0.8); }
			.ct-badge.hot { filter: brightness(1.6); outline: 1px solid rgba(255,255,255,0.85); }
			.ct-badge.target { box-shadow: 0 0 0 2px var(--accent), 0 0 12px rgba(122,162,247,0.55); z-index: 1; }
			.ct-badge.heat.target { box-shadow: 0 0 0 2px #fff, 0 0 12px rgba(255,255,255,0.5); }
			.ct-badge-lab { overflow: hidden; text-overflow: clip; font-variant-numeric: tabular-nums; }
			.ct-heat .ct-badge { flex: 1 1 0; min-width: 0; width: auto; }
			.ct-heat .ct-badge-lab { width: 100%; text-align: center; }
			.ct-tree-legend { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: var(--text-dim); }
			.ct-tree-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

			/* detached (drag-out) content windows */
			.ct-win { position: fixed; z-index: 80; right: 24px; top: 96px; width: min(560px, 92vw); max-height: 74vh; display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border: 1px solid var(--line-2); border-radius: 11px; box-shadow: 0 18px 50px rgba(0,0,0,0.62); }
			.ct-win-head { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: move; user-select: none; touch-action: none; }
			.ct-win-title { font-size: 14px; font-weight: 600; }
			.ct-win-sub { font-size: 11px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.ct-win-close { margin-left: auto; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text-dim); cursor: pointer; font-size: 16px; line-height: 1; }
			.ct-win-close:hover { color: var(--text); border-color: var(--accent); }
			.ct-win-body { overflow-y: auto; padding: 13px 15px; }
			/* the resizable 3D popout: viewer fills the window, controls pinned below */
			.ct-win.ct-win-3d { width: min(680px, 92vw); height: min(560px, 82vh); max-height: none; }
			.ct-win-3d-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
			.ct-win-3d .ct-canvas-host { flex: 1 1 auto; height: auto; min-height: 0; border-radius: 0; }
			.ct-win-3d .ct-3d-controls { flex: none; padding: 8px 12px; border-top: 1px solid var(--line); }
			.ct-win-resize { position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px; cursor: nwse-resize; z-index: 3; background: linear-gradient(135deg, transparent 45%, var(--line-2) 45%, var(--line-2) 58%, transparent 58%, transparent 72%, var(--line-2) 72%, var(--line-2) 85%, transparent 85%); }
		</style>

			}
		</script>
	</head>

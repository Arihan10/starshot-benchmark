<!doctype html>
<html lang="en" data-pipeline="dfs">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="server-url" content="http://127.0.0.1:8765" />
		<title>starshot · prompt bench</title>
		<style>
			:root {
				--bg: #101114;
				--panel: #16181d;
				--panel-2: #1c1e24;
				--line: #2a2d35;
				--line-2: #23262e;
				--text: #e6e6e6;
				--text-dim: #b8bcc4;
				--text-faint: #7a808c;
				--accent: #9ad4ff;
				--accent-line: #4a8fd8;
				--green: #8bd17c;
				--green-line: #3f7a52;
				--red: #ff8080;
				--amber: #e0c271;
				--orange: #e09050;
				--purple: #c9a6ff;
				--trace-w: 400px; /* left emittance-trace panel width */
			}
			/* BFS runs flip the main-screen backdrop to light, DFS stays dark,
               so the two pipelines are instantly distinguishable. Only the
               full-screen view backgrounds (every --bg surface) and the 3D
               viewport clear colour change — panels, text, and bbox colours are
               deliberately left alone (not a full theme). The data-pipeline
               attribute is injected onto <html> by server.mjs per run. */
			html[data-pipeline="bfs"] {
				--bg: #e9e7e2;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font:
					12px/1.45 "SF Mono",
					ui-monospace,
					Menlo,
					monospace;
				overflow: hidden;
			}
			button {
				font: inherit;
				color: var(--text-dim);
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 4px;
				padding: 5px 10px;
				cursor: pointer;
				white-space: nowrap;
			}
			button:hover:not(:disabled) {
				border-color: var(--accent-line);
				color: #c8d8f0;
			}
			button:disabled {
				opacity: 0.45;
				cursor: default;
			}
			button.primary {
				border-color: var(--green-line);
				background: #1d2c22;
				color: #c9f0d6;
			}
			button.primary:hover:not(:disabled) {
				background: #244e34;
				border-color: #4faf6e;
			}
			button.danger {
				border-color: #7a3f3f;
				background: #2c1d1d;
				color: #f0c9c9;
			}
			button.danger:hover:not(:disabled) {
				background: #4e2424;
				border-color: #af4f4f;
			}
			select,
			input[type="text"],
			textarea {
				font: inherit;
				color: var(--text);
				background: #0c0d10;
				border: 1px solid var(--line);
				border-radius: 4px;
				padding: 6px 8px;
			}
			select:focus,
			input:focus,
			textarea:focus {
				outline: none;
				border-color: var(--accent-line);
			}
			pre {
				margin: 0;
				white-space: pre-wrap;
				word-break: break-word;
				font:
					11px/1.5 "SF Mono",
					ui-monospace,
					Menlo,
					monospace;
			}
			.muted {
				color: var(--text-faint);
			}
			.fit-btn {
				font-size: 10px;
				padding: 1px 7px;
				flex-shrink: 0;
			}
			pre.fit-full {
				max-height: none !important;
			}
			/* folded scene-context placeholder inside an obs prompt <pre> */
			.ctx-fold-btn {
				color: var(--accent);
				cursor: pointer;
				font-style: italic;
				opacity: 0.85;
				border-bottom: 1px dotted var(--accent-line);
			}
			.ctx-fold-btn:hover {
				opacity: 1;
			}
			pre.diff .diff-ins {
				background: rgba(63, 122, 82, 0.4);
				color: #c9f0d6;
			}
			pre.diff .diff-del {
				background: rgba(122, 63, 63, 0.4);
				color: #f0c9c9;
				text-decoration: line-through;
			}
			.dot {
				display: inline-block;
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: #5a5e68;
				flex-shrink: 0;
			}
			.dot.running {
				background: var(--amber);
			}
			.dot.done {
				background: var(--green);
			}
			.dot.error {
				background: var(--red);
			}
			.dot.paused {
				background: var(--orange);
			}
			.dot.capped {
				background: var(--purple);
			}
			.dot.idle {
				background: #5a5e68;
			}

			/* ---------- topbar ---------- */
			#topbar {
				position: fixed;
				inset: 0 0 auto 0;
				height: 46px;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 12px;
				background: var(--panel-2);
				border-bottom: 1px solid var(--line);
				z-index: 40;
			}
			#topbar .brand {
				color: var(--accent);
				font-weight: 600;
				margin-right: 6px;
			}
			#topbar .sep {
				width: 1px;
				height: 22px;
				background: var(--line);
				margin: 0 4px;
			}
			#topbar #status-text {
				margin-left: auto;
				color: var(--text-faint);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			/* ---------- run pickers (searchable combobox: topbar + compare B) ---------- */
			.run-combo {
				position: relative;
				flex-shrink: 0;
			}
			.run-combo-btn {
				display: flex;
				align-items: center;
				gap: 8px;
				max-width: 320px;
			}
			.run-combo-btn .run-combo-lab {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.run-combo-btn .run-combo-caret {
				margin-left: auto;
				color: var(--text-faint);
				font-size: 10px;
			}
			.run-combo.open .run-combo-btn {
				border-color: var(--accent-line);
				color: #c8d8f0;
			}
			.run-combo-pop {
				position: absolute;
				top: calc(100% + 6px);
				left: 0;
				display: none;
				flex-direction: column;
				width: 340px;
				max-width: 92vw;
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 6px;
				box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
				overflow: hidden;
				z-index: 50;
			}
			.run-combo.open .run-combo-pop {
				display: flex;
			}
			.run-combo-search {
				margin: 8px;
				align-self: stretch;
			}
			.run-combo-list {
				max-height: 60vh;
				overflow: auto;
				padding: 0 4px 6px;
			}
			.run-combo-item {
				display: flex;
				align-items: baseline;
				gap: 8px;
				padding: 6px 8px;
				border-radius: 4px;
				cursor: pointer;
				color: var(--text-dim);
			}
			.run-combo-item:hover,
			.run-combo-item.active {
				background: #1d2027;
			}
			.run-combo-item.current {
				color: var(--accent);
			}
			.run-combo-item .run-combo-item-name {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.run-combo-item .run-combo-item-ver {
				margin-left: auto;
				flex-shrink: 0;
				color: var(--text-faint);
				font-size: 10px;
			}
			.run-combo-empty {
				padding: 8px;
				color: var(--text-faint);
			}

			/* ---------- per-run LLM spend tracker (top-bar pill + dropdown) ---------- */
			#cost-tracker {
				position: relative;
				flex-shrink: 0;
				font-size: 11px;
				line-height: 1.4;
			}
			#cost-pill {
				display: flex;
				align-items: center;
				gap: 7px;
				padding: 4px 9px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--panel);
				color: var(--text);
				font: inherit;
				cursor: pointer;
				text-align: left;
			}
			#cost-pill:hover {
				border-color: var(--accent-line);
			}
			#cost-pill .cost-caret {
				color: var(--text-faint);
				width: 9px;
			}
			#cost-tracker.collapsed #cost-pill .cost-caret::before {
				content: "\25B8";
			}
			#cost-tracker:not(.collapsed) #cost-pill .cost-caret::before {
				content: "\25BE";
			}
			#cost-pill .cost-pill-label {
				color: var(--text-faint);
				text-transform: uppercase;
				letter-spacing: 0.04em;
				font-size: 10px;
			}
			#cost-pill .cost-pill-summary {
				color: var(--accent);
				font-variant-numeric: tabular-nums;
			}
			#cost-dropdown {
				position: absolute;
				top: calc(100% + 6px);
				right: 0;
				width: 320px;
				max-width: 92vw;
				padding: 8px 10px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--panel);
				box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
				max-height: 70vh;
				overflow: auto;
				z-index: 50;
			}
			#cost-tracker.collapsed #cost-dropdown {
				display: none;
			}
			.cost-section {
				margin-bottom: 8px;
			}
			.cost-section:last-child {
				margin-bottom: 0;
			}
			.cost-section-head {
				display: flex;
				align-items: baseline;
				gap: 6px;
				color: var(--text-dim);
				margin-bottom: 3px;
			}
			.cost-section-head .cost-sec-name {
				font-weight: 600;
			}
			.cost-section-head .cost-sec-model {
				color: var(--text-faint);
				font-size: 10px;
			}
			.cost-section-head .cost-sec-sum {
				margin-left: auto;
				color: var(--accent);
				font-variant-numeric: tabular-nums;
			}
			.cost-row {
				display: flex;
				align-items: baseline;
				gap: 6px;
				padding: 1px 0 1px 10px;
			}
			.cost-row .cost-step {
				color: var(--text-dim);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.cost-row .cost-count {
				margin-left: auto;
				color: var(--text-faint);
				font-variant-numeric: tabular-nums;
				min-width: 30px;
				text-align: right;
			}
			.cost-row .cost-amt {
				color: var(--text-dim);
				font-variant-numeric: tabular-nums;
				min-width: 70px;
				text-align: right;
			}
			.cost-divider {
				height: 1px;
				background: var(--line);
				margin: 6px 0;
			}
			.cost-total {
				display: flex;
				align-items: baseline;
				gap: 6px;
				color: var(--text);
				font-weight: 600;
			}
			.cost-total .cost-count {
				margin-left: auto;
				color: var(--text-dim);
				font-variant-numeric: tabular-nums;
				min-width: 30px;
				text-align: right;
			}
			.cost-total .cost-amt {
				color: var(--accent);
				font-variant-numeric: tabular-nums;
				min-width: 70px;
				text-align: right;
			}
			.cost-empty {
				color: var(--text-faint);
				padding: 2px 0;
			}
			/* Capped cells: flag the collapsed pill purple so a spend-cap trip is
			   noticeable without expanding. Every cell shows its cap inline (faint
			   by default, purple once tripped). */
			#cost-tracker.has-capped #cost-pill {
				border-color: var(--purple);
			}
			#cost-tracker.has-capped #cost-pill .cost-pill-summary {
				color: var(--purple);
			}
			.cost-cap-row {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 1px 0 2px 10px;
			}
			.cost-cap-row .cost-cap-msg {
				color: var(--text-faint);
				font-size: 10px;
				font-variant-numeric: tabular-nums;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.cost-cap-row.reached .cost-cap-msg {
				color: var(--purple);
			}
			.cost-cap-row .cost-cap-set {
				margin-left: auto;
				flex-shrink: 0;
				padding: 1px 8px;
				font-size: 10px;
				color: var(--text-dim);
				background: transparent;
				border: 1px solid var(--line);
				border-radius: 4px;
				cursor: pointer;
			}
			.cost-cap-row .cost-cap-set:hover {
				border-color: var(--text-dim);
				color: var(--text);
			}
			.cost-cap-row.reached .cost-cap-set {
				color: var(--purple);
				border-color: var(--purple);
			}
			.cost-cap-row.reached .cost-cap-set:hover {
				background: rgba(201, 166, 255, 0.14);
			}

			/* ---------- board ---------- */
			#board {
				position: fixed;
				inset: 46px 0 0 0;
				overflow: hidden;
				cursor: grab;
			}
			#board.panning {
				cursor: grabbing;
			}
			/* "scenes" board view: a responsive grid of live 3D canvases, one
               per active run, for at-a-glance comparison across slots/models. */
			#board-scenes {
				position: fixed;
				inset: 46px 0 0 0;
				overflow: hidden;
				padding: 16px;
				display: none;
				grid-template-columns: 1fr;
				gap: 14px;
			}
			#board-scenes.open {
				display: grid;
			}
			#board-scenes .scene-empty {
				color: var(--text-faint);
				padding: 24px;
				grid-column: 1 / -1;
			}
			.scene-tile {
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--panel);
				overflow: hidden;
				display: flex;
				flex-direction: column;
				min-height: 0; /* shrink to its grid cell so the whole set fits */
			}
			.scene-tile-head {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 6px 10px;
				background: var(--panel-2);
				border-bottom: 1px solid var(--line-2);
				cursor: pointer;
				font-size: 12px;
			}
			.scene-tile-head:hover {
				background: #232730;
			}
			.scene-tile-name {
				font-weight: 600;
				color: var(--text);
			}
			.scene-tile-model {
				color: var(--text-faint);
				font-size: 11px;
			}
			.scene-tile-status {
				margin-left: auto;
				color: var(--text-faint);
				font-size: 10px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				max-width: 55%;
			}
			.scene-tile-host {
				position: relative;
				flex: 1;
				min-height: 0;
				overflow: hidden;
				background: #0c0d10;
			}
			.scene-tile-x {
				font-size: 11px;
				padding: 0 6px;
				line-height: 1.6;
				color: var(--text-faint);
				border: 1px solid var(--line);
				border-radius: 4px;
				background: transparent;
				cursor: pointer;
				flex-shrink: 0;
			}
			.scene-tile-x:hover {
				color: #f0c9c9;
				border-color: #7a3f3f;
				background: rgba(122, 63, 63, 0.28);
			}
			/* floating "+ add slot" launcher for the scenes grid */
			#scene-add-fab {
				position: fixed;
				bottom: 18px;
				left: 18px;
				z-index: 45;
				display: none;
				font-size: 12px;
				font-weight: 600;
				padding: 8px 14px;
				border-radius: 20px;
				background: var(--panel-2);
				color: var(--accent);
				border: 1px solid var(--accent-line);
				cursor: pointer;
				box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
			}
			#scene-add-fab.open {
				display: block;
			}
			#scene-add-fab:hover {
				background: #16222e;
			}
			.scene-add-list {
				max-height: 50vh;
				overflow: auto;
				display: flex;
				flex-direction: column;
				gap: 3px;
			}
			.scene-add-row {
				display: flex;
				align-items: center;
				gap: 8px;
				text-align: left;
				padding: 5px 8px;
				background: var(--panel-2);
				border: 1px solid var(--line);
				border-radius: 5px;
				cursor: pointer;
				color: var(--text-dim);
				font-size: 12px;
			}
			.scene-add-row:hover {
				border-color: var(--accent-line);
				background: #16222e;
			}
			.scene-add-name {
				font-weight: 600;
				color: var(--text);
			}
			.scene-add-model {
				color: var(--text-faint);
				font-size: 11px;
			}
			.scene-add-row .muted {
				margin-left: auto;
			}
			/* Mini observability pipeline overlaid on each tile's canvas. */
			.obsm-mini {
				position: absolute;
				left: 0;
				top: 0;
				bottom: 0;
				width: min(44%, 168px);
				overflow: auto;
				padding: 4px 6px;
				font-size: 10px;
				background: rgba(8, 9, 12, 0.6);
				border-right: 1px solid var(--line-2);
				cursor: pointer;
				backdrop-filter: blur(2px);
			}
			.obsm-mini:hover {
				background: rgba(12, 14, 20, 0.78);
			}
			.obsm-mini .obsm-mini-head {
				display: flex;
				align-items: center;
				gap: 4px;
				color: var(--text-faint);
				font-size: 9px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				margin-bottom: 3px;
			}
			/* obsm tree (shared by the mini panel + the right drawer) */
			.obsm-row {
				display: flex;
				align-items: center;
				gap: 5px;
				padding: 1px 0;
			}
			.obsm-id {
				color: var(--text-dim);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.obsm-phase {
				color: var(--text-faint);
				font-size: 0.85em;
				margin-left: auto;
				flex-shrink: 0;
			}
			.obsm-empty {
				color: var(--text-faint);
				padding: 4px;
			}
			.obsm-calls {
				margin-left: 9px;
				border-left: 1px solid var(--line-2);
				padding-left: 6px;
			}
			.obsm-call {
				display: flex;
				align-items: center;
				gap: 5px;
				padding: 1px 0;
				cursor: pointer;
				color: var(--text-faint);
			}
			.obsm-call:hover {
				color: var(--text-dim);
			}
			.obsm-call .step-badge {
				color: var(--accent);
			}
			.obsm-call .caret {
				width: 9px;
				flex-shrink: 0;
			}
			.obsm-detail {
				margin: 2px 0 4px 14px;
			}
			.obsm-sec {
				margin-bottom: 5px;
			}
			.obsm-sec-lab {
				color: var(--text-faint);
				font-size: 0.85em;
				margin-bottom: 2px;
			}
			.obsm-detail pre {
				margin: 0;
				white-space: pre-wrap;
				word-break: break-word;
				max-height: 220px;
				overflow: auto;
				background: var(--panel-2);
				border: 1px solid var(--line-2);
				border-radius: 4px;
				padding: 5px;
			}
			/* Right-side observability drawer (opened from a tile's mini tree). */
			#obs-drawer {
				position: fixed;
				top: 46px;
				right: 0;
				bottom: 0;
				width: min(460px, 42vw);
				background: var(--panel);
				border-left: 1px solid var(--line);
				box-shadow: -8px 0 24px rgba(0, 0, 0, 0.4);
				z-index: 50;
				display: none;
				flex-direction: column;
			}
			#obs-drawer.open {
				display: flex;
			}
			#obs-drawer-head {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 8px 12px;
				background: var(--panel-2);
				border-bottom: 1px solid var(--line);
				flex-shrink: 0;
			}
			#obs-drawer-head .title {
				color: var(--purple);
				font-weight: 600;
			}
			#obs-drawer-body {
				flex: 1;
				overflow: auto;
				padding: 10px 12px;
				font-size: 12px;
			}
			/* obs drawer: clickable node rows + the per-object emit trace. */
			.obsm-row.clickable {
				cursor: pointer;
				border-radius: 4px;
			}
			.obsm-row.clickable:hover {
				background: #1d2027;
			}
			.obsm-call.emits .step-badge {
				border-color: var(--amber);
				color: var(--amber);
			}
			.obsm-call .emit-badge {

			}
			.obsm-back {
				align-self: flex-start;

			}
			/* drawer: "via {step}" origin pill + focused node's provenance block. */
			.obsm-via {

				padding: 0 5px;

				border: 1px solid #5a4d2a;

			.obsm-prov {

			.obsm-prov-lab {

			.obsm-prov-tag {

			}

			.obsm-crumbs {

			}
			.obsm-crumb {
				color: var(--text-dim);

			}
			.obsm-crumb:hover {

			}

			.cell-card .step-line {

				font-size: 11px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.cell-card .meta-line {
				color: var(--text-faint);
				font-size: 10px;
			}
			.cell-card .branch-chip {
				display: flex;
				align-items: center;
				gap: 6px;
				margin-top: 2px;
				padding: 4px 7px;
				border: 1px dashed #5a4a8a;
				border-radius: 5px;
				color: var(--purple);
				font-size: 10px;
			}
			.cell-card.empty {
				opacity: 0.45;
			}
			.cell-card.sim-dim {
				opacity: 0.3;
			}
			.cell-card .step-mode-tag {
				margin-left: auto;
				font-size: 9px;
				color: var(--amber);
				border: 1px solid #5a4d2a;
				border-radius: 3px;
				padding: 0 5px;
				white-space: nowrap;
			}
			/* "step (all) until <step>" picker — sits next to step / step-all. */
			/* ---------- step-until picker (custom popover) ---------- */
			/* Trigger button (replaces the old native <select>); the popover it
			   opens carries the before/after toggle + the step list. */
			.step-until {
				font-size: 11px;
				padding: 3px 8px;
				max-width: 160px;
				background: var(--panel-2);
				color: var(--text-dim);
				border: 1px solid var(--line);
				border-radius: 5px;
				cursor: pointer;
				white-space: nowrap;
			}
			.step-until:hover {
				border-color: var(--accent-line);
			}
			.step-until-pop {
				position: fixed;
				z-index: 130; /* transient, above the overlay (100) + modals (120) */
				min-width: 180px;
				max-height: 60vh;
				display: flex;
				flex-direction: column;
				gap: 4px;
				padding: 6px;
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 8px;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
			}
			.su-seg-row {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 2px 4px 6px;
				border-bottom: 1px solid var(--line);
			}
			.su-seg-lab {
				color: var(--text-faint);
				text-transform: uppercase;
				letter-spacing: 0.05em;
				font-size: 10px;
			}
			.su-seg {
				display: flex;
				margin-left: auto;
				border: 1px solid var(--line);
				border-radius: 6px;
				overflow: hidden;
			}
			.su-seg-btn {
				font-size: 11px;
				padding: 3px 10px;
				background: var(--panel-2);
				color: var(--text-dim);
				border: none;
				cursor: pointer;
			}
			.su-seg-btn + .su-seg-btn {
				border-left: 1px solid var(--line);
			}
			.su-seg-btn.on {
				background: var(--accent);
				color: var(--bg);
			}
			.su-list {
				display: flex;
				flex-direction: column;
				gap: 1px;
				overflow: auto;
			}
			.su-step {
				text-align: left;
				font-size: 12px;
				padding: 5px 8px;
				background: transparent;
				color: var(--text);
				border: none;
				border-radius: 5px;
				cursor: pointer;
				white-space: nowrap;
			}
			.su-step:hover {
				background: var(--panel-2);
				color: var(--accent);
			}
			.su-empty {
				color: var(--text-faint);
				font-size: 11px;
				padding: 6px 8px;
			}

			/* ---------- board multi-select ---------- */
			/* A contextual action bar pinned under the topbar; the board slides
               down to make room while select mode is on. */
			#btn-select.on {
				border-color: var(--accent-line);
				color: var(--accent);
				background: #16222e;
			}
			body.select-mode #board,
			body.select-mode #board-scenes {
				top: 88px;
			}
			#bulk-bar {
				position: fixed;
				top: 46px;
				left: 0;
				right: 0;
				height: 42px;
				display: none;
				align-items: center;
				gap: 8px;
				padding: 0 12px;
				background: var(--panel);
				border-bottom: 1px solid var(--line);
				z-index: 39; /* under the topbar (40), over the board */
			}
			#bulk-bar.open {
				display: flex;
			}
			#bulk-bar .bulk-check {
				color: var(--accent);
			}
			#bulk-bar .bulk-count {
				color: var(--text-dim);
				font-variant-numeric: tabular-nums;
				min-width: 76px;
			}
			#bulk-bar .bulk-mini {
				font-size: 11px;
				padding: 3px 8px;
			}
			#bulk-bar .bulk-sep {
				width: 1px;
				height: 22px;
				background: var(--line);
				margin: 0 2px;
			}
			#bulk-bar button {
				font-size: 11px;
			}
			#bulk-bar .bulk-stepped {
				display: flex;
				align-items: center;
				gap: 5px;
				color: var(--text-dim);
				font-size: 11px;
				cursor: pointer;
				white-space: nowrap;
			}
			#bulk-bar .bulk-done {
				margin-left: 0;
			}
			.cell-card.selectable {
				cursor: pointer;
			}
			.cell-card.selected {
				border-color: var(--accent-line);
				background: #16222e;
				box-shadow: inset 0 0 0 1px var(--accent-line);
			}
			.cell-card .sel-box {
				width: 14px;
				height: 14px;
				flex-shrink: 0;
				border: 1px solid var(--line);
				border-radius: 3px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				font-size: 10px;
				line-height: 1;
				color: var(--accent);
				background: #0c0d10;
			}
			.cell-card .sel-box.on {
				border-color: var(--accent-line);
				background: #1d3343;
			}
			body.select-mode .grid-head {
				cursor: pointer;
			}
			body.select-mode .grid-head:hover {
				color: var(--accent);
			}

			/* ---------- overlay (cell view) ---------- */
			#overlay {
				position: fixed;
				inset: 0;
				background: var(--bg);
				z-index: 100; /* above the prompt lab (80) AND the compare view (95), so the full scene can be inspected from either; below modals (120) */
				display: flex;
				flex-direction: column;
				transform: translateX(100%);
				transition: transform 0.22s ease;
			}
			#overlay.open {
				transform: translateX(0);
			}
			#overlay-head {
				height: 46px;
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 0 12px;
				background: var(--panel-2);
				border-bottom: 1px solid var(--line);
				flex-shrink: 0;
			}
			#overlay-head .title {
				font-weight: 600;
				color: var(--accent);
			}
			#overlay-head .crumbs {
				color: var(--text-faint);
			}
			#overlay-status {
				min-width: 0;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			#overlay-status.is-error {
				color: var(--red);
			}
			#overlay-body {
				flex: 1;
				display: flex;
				min-height: 0;
			}
			#canvas-host {
				flex: 1;
				position: relative;
				min-width: 0;
			}
			#canvas-host canvas {
				display: block;
			}
			#viewer-toggles {
				position: absolute;
				left: 10px;
				bottom: 10px;
				display: flex;
				gap: 6px;
				z-index: 5;
				transition: left 0.2s ease;
			}
			#viewer-toggles button {
				font-size: 10px;
				padding: 3px 8px;
			}
			#viewer-toggles button.off {
				opacity: 0.5;
			}
			/* Objects multiselect dropdown (buildObjectsMenu) — lives inline in a
			   viewer's toggle row; the trigger button inherits the row's button
			   style, so only the popup + items need styling here. */
			.vt-menu {
				position: relative;
				display: inline-flex;
			}
			.vt-menu-pop {
				position: absolute;
				bottom: 100%; /* #viewer-toggles is bottom-left, so open upward */
				left: 0;
				margin-bottom: 4px;
				display: none;
				flex-direction: column;
				gap: 1px;
				min-width: 132px;
				padding: 5px;
				background: var(--panel-2);
				border: 1px solid var(--line-2);
				border-radius: 6px;
				box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
				z-index: 10;
			}
			.cmp-toggles .vt-menu-pop {
				/* compare panes carry the toggle row at the TOP, so drop it downward */
				top: 100%;
				bottom: auto;
				margin-top: 4px;
				margin-bottom: 0;
			}
			.vt-menu.open .vt-menu-pop {
				display: flex;
			}
			.vt-menu-item {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 2px 4px;
				font-size: 11px;
				color: var(--text-dim);
				cursor: pointer;
				white-space: nowrap;
			}
			.vt-menu-item input {
				cursor: pointer;
			}
			.vt-menu-item:has(input:disabled) {
				/* the categories greyed out while NONE masks them */
				opacity: 0.4;
				cursor: default;
			}
			.vt-menu-none {
				color: var(--text);
			}
			.vt-menu-sep {
				height: 1px;
				background: var(--line);
				margin: 3px 0;
			}
			/* Zone-layers legend: a colour swatch per nesting depth present in the
               scene, shown only while the zone-layers view is on. Top-left so it
               never collides with the bottom-left toggle row when it wraps. */
			#zone-layers-legend {
				position: absolute;
				left: 10px;
				top: 10px;
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 6px;
				max-width: calc(100% - 20px);
				z-index: 5;
				transition: left 0.2s ease;
			}
			/* While the emittance-trace panel is open, slide the canvas overlays
			   clear of it so the toggles + zone legend stay usable. */
			#canvas-host:has(#trace-panel.open) #viewer-toggles,
			#canvas-host:has(#trace-panel.open) #zone-layers-legend {
				left: calc(var(--trace-w) + 16px);
			}
			#canvas-host:has(#trace-panel.open) #zone-layers-legend {
				max-width: calc(100% - var(--trace-w) - 36px);
			}

			/* ---------- emittance-trace panel (left, selection-driven) ----------
			   Floats over the left of the scene canvas; slides in when an object
			   or zone is picked in 3D and shows that node's full LLM-call lineage
			   (reuses the .obsm-* trace styles from the scenes drawer). */
			#trace-panel {
				position: absolute;
				left: 0;
				top: 0;
				bottom: 0;
				width: var(--trace-w);
				max-width: 92%;
				background: var(--panel);
				border-right: 1px solid var(--line);
				box-shadow: 8px 0 24px rgba(0, 0, 0, 0.4);
				z-index: 7; /* over the canvas + toggles (5), under the tooltip (110) */
				display: flex;
				flex-direction: row; /* [ inner column | drag handle ] */
				min-height: 0;
				/* Hide via visibility, not transform alone: the panel lives inside
				   the overlay, which itself slides off-screen (translateX(100%)) when
				   closed — so the panel's own translateX(-100%) cancels against it and
				   would leave an empty strip pinned to the right edge. visibility
				   guarantees it's gone whenever it isn't .open. It flips instantly
				   (no delay) so closing the scene never flashes the panel; the slide
				   is kept only on open. */
				visibility: hidden;
				transform: translateX(-100%);
				transition:
					transform 0.2s ease,
					visibility 0s;
			}
			#trace-panel.open {
				visibility: visible;
				transform: translateX(0);
				transition: transform 0.2s ease;
			}
			#trace-panel-inner {
				flex: 1;
				min-width: 0;
				min-height: 0;
				display: flex;
				flex-direction: column;
			}
			#trace-panel-resizer {
				width: 7px;
				flex-shrink: 0;
				cursor: col-resize;
				position: relative;
				z-index: 8;
				touch-action: none;
			}
			#trace-panel-resizer::before {
				content: "";
				position: absolute;
				top: 0;
				bottom: 0;
				right: 1px;
				width: 1px;
				background: var(--line);
			}
			#trace-panel-resizer:hover::before,
			body.trace-resizing #trace-panel-resizer::before {
				right: 0;
				width: 3px;
				background: var(--accent-line);
			}
			/* While dragging the handle, pin the canvas overlays to the cursor
			   (drop their slide transition so they don't lag the panel edge). */
			body.trace-resizing #viewer-toggles,
			body.trace-resizing #zone-layers-legend {
				transition: none;
			}
			#trace-panel-head {
				padding: 8px 12px;
				background: var(--panel-2);
				border-bottom: 1px solid var(--line);
				flex-shrink: 0;
			}
			#trace-panel-head .tp-head-top {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			#trace-panel-head .title {
				color: var(--purple);
				font-weight: 600;
			}
			#trace-panel-head .tp-close {
				margin-left: auto;
				font-size: 11px;
				padding: 3px 9px;
			}
			#trace-panel-head .tp-node {
				display: block;
				margin-top: 4px;
				color: var(--text-dim);
				font-size: 11px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			#trace-panel-scroll {
				flex: 1;
				overflow: auto;
				padding: 10px 12px;
				font-size: 12px;
			}
			/* focused-node info block: mini 3D preview + debug fields */
			.tp-info {
				margin-bottom: 10px;
				padding-bottom: 10px;
				border-bottom: 1px solid var(--line);
			}
			.tp-preview {
				position: relative;
				height: 180px;
				margin-bottom: 9px;
				background: #0c0d10;
				border: 1px solid var(--line-2);
				border-radius: 6px;
				overflow: hidden;
			}
			.tp-preview canvas {
				display: block;
			}
			/* canonical-axes toggle + colour legend, overlaid on the mini canvas */
			.tp-axes-btn {
				position: absolute;
				top: 6px;
				right: 6px;
				z-index: 3;
				font-size: 10px;
				padding: 2px 7px;
				background: rgba(12, 14, 20, 0.72);
				backdrop-filter: blur(2px);
			}
			.tp-axes-btn.on {
				border-color: var(--accent-line);
				color: var(--accent);
				background: #16222e;
			}
			.tp-axes-legend {
				position: absolute;
				left: 6px;
				bottom: 6px;
				z-index: 3;
				display: flex;
				gap: 7px;
				padding: 2px 7px;
				border-radius: 4px;
				background: rgba(12, 14, 20, 0.72);
				backdrop-filter: blur(2px);
				font-size: 10px;
				font-weight: 600;
			}
			.tp-axes-legend .ax-x {
				color: #ff5b5b;
			}
			.tp-axes-legend .ax-y {
				color: #5bd15b;
			}
			.tp-axes-legend .ax-z {
				color: #5b8bff;
			}
			.tp-fields {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			.tp-field-group {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}
			.tp-field-lab {
				color: var(--text-faint);
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
			}
			.tp-field-val {
				color: var(--text);
				white-space: pre-wrap;
				word-break: break-word;
				line-height: 1.5;
			}
			.tp-props {
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 3px 10px;
				align-items: baseline;
			}
			.tp-prop {
				display: contents;
			}
			.tp-prop-lab {
				color: var(--text-faint);
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				white-space: nowrap;
			}
			.tp-prop-val {
				color: var(--text);
				font-variant-numeric: tabular-nums;
				word-break: break-word;
			}
			.tp-rels {
				display: flex;
				flex-direction: column;
				gap: 3px;
			}
			.tp-rel {
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.tp-rel-kind {
				color: var(--amber);
				font-size: 10px;
				border: 1px solid #5a4d2a;
				border-radius: 3px;
				padding: 0 5px;
				white-space: nowrap;
			}
			.tp-rel-arrow {
				color: var(--text-faint);
			}
			.tp-rel-target {
				color: var(--text-dim);

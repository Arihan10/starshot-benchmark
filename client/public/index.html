				border-radius: 50%;
				background: var(--purple);
				opacity: 0.4;
				animation: ivg-blink 1.1s infinite ease-in-out;
			}
			.ivg-dots i:nth-child(2) {
				animation-delay: 0.18s;
			}
			.ivg-dots i:nth-child(3) {
				animation-delay: 0.36s;
			}
			@keyframes ivg-blink {
				0%,
				80%,
				100% {
					opacity: 0.3;
				}
				40% {
					opacity: 1;
				}
			}
			.ivg-attach {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 5px;
				padding: 7px 12px;
				border-top: 1px solid var(--line-2);
				background: #14151a;
				flex-shrink: 0;
			}
			.ivg-attach-lab {
				font-size: 10px;
				color: var(--text-faint);
				text-transform: uppercase;
				letter-spacing: 0.04em;
			}
			.ivg-pill {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				font-size: 10px;
				padding: 2px 4px 2px 8px;
				border: 1px solid #5a4a8a;
				border-radius: 10px;
				color: var(--purple);
				background: #1b1626;
				max-width: 100%;
			}
			.ivg-pill-lab {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				max-width: 220px;
			}
			.ivg-pill-x {
				font-size: 10px;
				line-height: 1;
				padding: 0 4px;
				border: none;
				background: none;
				color: var(--text-faint);
				cursor: pointer;
			}
			.ivg-pill-x:hover {
				color: #f0c9c9;
			}
			.ivg-foot {
				position: relative;
				padding: 9px 12px;
				border-top: 1px solid var(--line);
				background: var(--panel-2);
				flex-shrink: 0;
			}
			.ivg-inputrow {
				display: flex;
				gap: 8px;
				align-items: flex-end;
			}
			.ivg-input {
				flex: 1;
				resize: vertical;
				min-height: 44px;
				max-height: 200px;
				font-size: 12px;
				line-height: 1.45;
			}
			.ivg-footbtns {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.ivg-add {
				font-size: 10px;
				padding: 3px 8px;
				color: var(--purple);
				border-color: #5a4a8a;
			}
			.ivg-add:hover {
				background: #1b1626;
			}
			.ivg-send {
				flex-shrink: 0;
			}
			.ivg-mention {
				position: absolute;
				left: 12px;
				right: 12px;
				bottom: calc(100% + 4px);
				max-height: 260px;
				overflow: auto;
				background: var(--panel-2);
				border: 1px solid #5a4a8a;
				border-radius: 6px;
				box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
				z-index: 10;
			}
			.ivg-mention-empty {
				padding: 8px;
				color: var(--text-faint);
				font-size: 11px;
			}
			.ivg-mention-row {
				display: flex;
				align-items: center;
				gap: 7px;
				padding: 5px 9px;
				cursor: pointer;
				font-size: 11px;
				color: var(--text-dim);
			}
			.ivg-mention-row.active {
				background: #241d38;
			}
			.ivg-mention-row.on .ivg-mention-node {
				color: var(--purple);
			}
			.ivg-mention-head {
				padding: 5px 9px 2px;
				font-size: 9px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				color: var(--text-faint);
			}
			.ivg-mention-step {
				color: var(--accent);
				flex-shrink: 0;
			}
			.ivg-mention-kind {
				color: var(--green);
				flex-shrink: 0;
				text-transform: uppercase;
				font-size: 9px;
				letter-spacing: 0.03em;
			}
			.ivg-mention-node {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.ivg-mention-idx {
				margin-left: auto;
				color: var(--text-faint);
				flex-shrink: 0;
			}
			.ivg-mention-tick {
				color: var(--green);
				flex-shrink: 0;
			}

			/* ---------- markdown (investigator answers) ---------- */
			.md {
				font-size: 12px;
				line-height: 1.55;
			}
			.md > :first-child {
				margin-top: 0;
			}
			.md > :last-child {
				margin-bottom: 0;
			}
			.md .md-p {
				margin: 0 0 8px;
			}
			.md .md-h {
				margin: 12px 0 6px;
				line-height: 1.3;
				color: var(--text);
				font-weight: 600;
			}
			.md h1.md-h1 {
				font-size: 15px;
			}
			.md h2.md-h2 {
				font-size: 14px;
			}
			.md h3.md-h3 {
				font-size: 13px;
			}
			.md h4.md-h4,
			.md h5.md-h5,
			.md h6.md-h6 {
				font-size: 12px;
				color: var(--text-dim);
			}
			.md .md-ul,
			.md .md-ol {
				margin: 0 0 8px;
				padding-left: 20px;
			}
			.md .md-li {
				margin: 2px 0;
			}
			.md .md-li > .md-ul,
			.md .md-li > .md-ol {
				margin: 2px 0;
			}
			.md .md-quote {
				margin: 0 0 8px;
				padding: 2px 10px;
				border-left: 3px solid var(--line);
				color: var(--text-dim);
			}
			.md .md-hr {
				border: none;
				border-top: 1px solid var(--line);
				margin: 10px 0;
			}
			.md .md-pre {
				margin: 0 0 8px;
				background: #0c0d10;
				border: 1px solid var(--line-2);
				border-radius: 5px;
				padding: 8px;
				overflow: auto;
			}
			.md .md-pre .md-code {
				white-space: pre;
				font:
					11px/1.5 "SF Mono",
					ui-monospace,
					Menlo,
					monospace;
				color: var(--text);
				background: none;
				padding: 0;
				border: none;
			}
			.md .md-code-inline {
				font:
					11px/1.4 "SF Mono",
					ui-monospace,
					Menlo,
					monospace;
				background: #0c0d10;
				border: 1px solid var(--line-2);
				border-radius: 3px;
				padding: 0 4px;
				color: #d8ecff;
				word-break: break-word;
			}
			.md .md-link {
				color: var(--accent);
				text-decoration: none;
			}
			.md .md-link:hover {
				text-decoration: underline;
			}
			.md .md-strong {
				color: var(--text);
				font-weight: 600;
			}
			.md .md-em {
				font-style: italic;
			}
			.md .md-strike {
				text-decoration: line-through;
				opacity: 0.8;
			}
			.md .md-table {
				border-collapse: collapse;
				margin: 0 0 8px;
				font-size: 11px;
				display: block;
				overflow-x: auto;
			}
			.md .md-table th,
			.md .md-table td {
				border: 1px solid var(--line);
				padding: 4px 8px;
				text-align: left;
			}
			.md .md-table th {
				background: var(--panel);
				color: var(--text-dim);
			}

			/* ---------- prompt lab ---------- */
			#lab {
				position: fixed;
				inset: 0;
				background: var(--bg);
				z-index: 80;
				display: none;
				flex-direction: column;
			}
			#lab.open {
				display: flex;
			}
			#lab-head {
				height: 46px;
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 0 12px;
				background: var(--panel-2);
				border-bottom: 1px solid var(--line);
				flex-shrink: 0;
			}
			#lab-head .title {
				color: var(--purple);
				font-weight: 600;
			}
			#lab-body {
				flex: 1;
				display: flex;
				min-height: 0;
			}
			#lab-steps {
				width: 210px;
				flex-shrink: 0;
				border-right: 1px solid var(--line);
				overflow: auto;
				padding: 8px;
			}
			.lab-step-row {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 6px 8px;
				border-radius: 5px;
				cursor: pointer;
				color: var(--text-dim);
			}
			.lab-step-row:hover {
				background: #1d2027;
			}
			.lab-step-row.active {
				background: #241d38;
				color: var(--purple);
			}
			.lab-step-row .edited-flag {
				margin-left: auto;
				color: var(--amber);
			}
			.lab-step-row .lab-step-revert {
				margin-left: auto;
				padding: 0 4px;
				border: none;
				background: none;
				color: var(--text-faint);
				cursor: pointer;
				font-size: 12px;
				line-height: 1;
			}
			/* An edited row already pushes its flag to the right; keep the revert
			   button snug beside it rather than taking the auto-margin itself. */
			.lab-step-row .edited-flag + .lab-step-revert {
				margin-left: 0;
			}
			.lab-step-row .lab-step-revert:hover {
				color: var(--amber);
			}
			#lab-editor {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-width: 0;
				padding: 10px;
				gap: 8px;
				overflow: auto;
			}
			#lab-editor .ed-label {
				color: var(--text-faint);
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				display: flex;
				align-items: center;
				gap: 8px;
			}
			#lab-editor textarea {
				width: 100%;
				font-size: 11px;
				line-height: 1.5;
				resize: vertical;
				tab-size: 2;
			}
			#lab-sys {
				min-height: 130px;
			}
			#lab-usr {
				min-height: 260px;
			}
			#lab-vars {
				display: flex;
				flex-wrap: wrap;
				gap: 5px;
			}
			.var-chip {
				font-size: 10px;
				color: var(--purple);
				border: 1px solid #5a4a8a;
				border-radius: 3px;
				padding: 1px 6px;
				cursor: pointer;
				user-select: none;
			}
			.var-chip:hover {
				background: #241d38;
			}
			.var-chip.dim {
				opacity: 0.45;
				border-style: dashed;
			}
			.var-chip.dim:hover {
				opacity: 0.85;
			}
			/* Variable hover preview: the token's real rendered sample (server-
               side, via the actual injection functions). Scrollable for big
               blocks like SCENE_CONTEXT. */
			.var-preview {
				position: fixed;
				z-index: 200;
				display: none;
				width: min(560px, 46vw);
				max-height: 52vh;
				background: var(--panel-2);
				border: 1px solid #5a4a8a;
				border-radius: 6px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
			}
			.var-preview.open {
				display: flex;
				flex-direction: column;
			}
			.var-preview-head {
				display: flex;
				align-items: baseline;
				gap: 8px;
				justify-content: space-between;
				padding: 6px 9px;
				background: var(--panel);
				border-bottom: 1px solid var(--line-2);
				flex-shrink: 0;
			}
			.var-preview-name {
				color: var(--purple);
				font-weight: 600;
			}
			.var-preview-note {
				color: var(--text-faint);
				font-size: 9px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				white-space: nowrap;
			}
			.var-preview-body {
				flex: 1;
				min-height: 0;
				margin: 0;
				padding: 8px 9px;
				overflow: auto;
				white-space: pre-wrap;
				word-break: break-word;
				color: var(--text-dim);
				font:
					11px/1.5 "SF Mono",
					ui-monospace,
					Menlo,
					monospace;
			}
			.var-preview-foot {
				padding: 5px 9px;
				border-top: 1px solid var(--line-2);
				color: var(--text-faint);
				font-size: 9px;
				flex-shrink: 0;
			}
			#lab-right {
				/* The debug grid: resizable via #lab-resizer, defaults to
                   roughly half the lab so the editor and the live canvases
                   share the screen for fast edit → test → diff iteration. */
				width: 52%;
				min-width: 360px;
				flex-shrink: 0;
				border-left: 1px solid var(--line);
				display: flex;
				flex-direction: column;
				min-height: 0;
			}
			#lab-resizer {
				width: 7px;
				flex-shrink: 0;
				cursor: col-resize;
				position: relative;
				z-index: 6;
				touch-action: none;
			}
			#lab-resizer::before {
				content: "";
				position: absolute;
				top: 0;
				bottom: 0;
				left: 3px;
				width: 1px;
				background: var(--line);
			}
			#lab-resizer:hover::before,
			#lab-resizer.dragging::before {
				left: 2px;
				width: 3px;
				background: var(--accent-line);
			}
			#lab-right .pane-head {
				padding: 8px 12px;
				border-bottom: 1px solid var(--line-2);
				color: var(--text-dim);
				display: flex;
				align-items: center;
				gap: 8px;
				flex-shrink: 0;
				flex-wrap: wrap;
			}
			#lab-right .pane-head .rc-label {
				color: var(--text-faint);
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
			}
			#lab-sections {
				display: flex;
				gap: 4px;
			}
			#lab-cols {
				padding: 3px 6px;
				font-size: 11px;
			}
			/* Debug grid host: live canvases / text diffs of the selected slots. */
			#lab-grid {
				flex: 1;
				overflow: auto;
				padding: 12px;
				display: grid;
				gap: 12px;
				align-items: start;
				grid-auto-rows: min-content;
			}
			#lab-grid .grid-empty {
				color: var(--text-faint);
				padding: 16px;
				grid-column: 1 / -1;
				line-height: 1.6;
			}
			.ev-scene-btn {
				font-size: 10px;
				padding: 1px 7px;
				flex-shrink: 0;
			}
			/* Per-card test status line (queued / running / error). */
			.t-status {
				color: var(--amber);
				font-size: 11px;
			}
			.t-status.ok {
				color: var(--green);
			}
			.t-status.err {
				color: var(--red);
			}
			#lab-actions {
				border-top: 1px solid var(--line);
				padding: 9px 12px;
				display: flex;
				gap: 8px;
				align-items: center;
				flex-shrink: 0;
				flex-wrap: wrap;
			}
			#lab-actions .count {
				color: var(--text-faint);
				margin-right: auto;
			}

			/* ---------- side-by-side 3D compare ---------- */
			/* The cell's live run vs its simulation branch (previous result vs
               current). Launched from a debug-grid card; sits above the lab. */
			#compare {
				position: fixed;
				inset: 0;
				background: var(--bg);
				z-index: 95;
				display: none;
				flex-direction: column;
			}
			#compare.open {
				display: flex;
			}
			#compare-head {
				height: 46px;
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 0 12px;
				background: var(--panel-2);
				border-bottom: 1px solid var(--line);
				flex-shrink: 0;
			}
			#compare-head .title {
				color: var(--purple);
				font-weight: 600;
			}
			#compare-head .cmp-link {
				font-size: 11px;
				color: var(--text-dim);
				display: flex;
				align-items: center;
				gap: 4px;
			}
			#compare-body {
				flex: 1;
				display: flex;
				min-height: 0;
			}
			.cmp-col {
				flex: 1;
				min-width: 0;
				display: flex;
				flex-direction: column;
				border-right: 1px solid var(--line);
			}
			.cmp-col:last-child {
				border-right: 0;
			}
			.cmp-col-head {
				padding: 5px 12px;
				background: #14151a;
				border-bottom: 1px solid var(--line-2);
				font-size: 11px;
				letter-spacing: 0.04em;
			}
			.cmp-col-head.prev {
				color: var(--text-faint);
			}
			.cmp-col-head.cur {
				color: var(--accent);
			}
			.cmp-col-head {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.cmp-head-text {
				flex: 0 0 auto;
				white-space: nowrap;
			}
			.cmp-step-ctl {
				margin-left: auto;
				display: flex;
				align-items: center;
				gap: 4px;
				min-width: 0;
			}
			.cmp-step-btn {
				font-size: 10px;
				padding: 1px 7px;
				letter-spacing: 0;
			}
			.cmp-step-label {
				font-size: 10px;
				color: var(--text-faint);
				letter-spacing: 0;
				max-width: 230px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			/* Per-step multi-LLM A/B: the "run next step on" model picker and the
               resulting per-model outcome chips, above the simulation canvas. */
			.cmp-sim-bar {
				display: flex;
				flex-direction: column;
				gap: 5px;
				padding: 5px 12px;
				background: #101218;
				border-bottom: 1px solid var(--line-2);
			}
			.cmp-pick-row {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 5px;
				min-height: 20px;
			}
			.cmp-pick-lab {
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				color: var(--text-faint);
				margin-right: 2px;
			}
			.cmp-model-chip {
				font-size: 10px;
				padding: 1px 8px;
				border-radius: 10px;
				opacity: 0.45;
			}
			.cmp-model-chip.on {
				opacity: 1;
				border-color: var(--accent);
				color: var(--accent);
			}
			.cmp-cand {
				font-size: 10px;
				padding: 1px 8px;
				display: inline-flex;
				align-items: center;
				gap: 5px;
			}
			.cmp-cand.on {
				border-color: var(--accent);
				color: var(--text);
				background: rgba(154, 212, 255, 0.12);
			}
			.cmp-cand.err {
				opacity: 0.65;
			}
			.cmp-cand-tok {
				color: var(--text-faint);
			}
			.cmp-cand-chg {
				color: var(--accent);
			}
			.cmp-cand-same {
				color: var(--text-faint);
			}
			.cmp-cand-err {
				color: #ff8a8a;
			}
			.cmp-cand-head {
				color: var(--purple);
				font-size: 9px;
			}
			.cmp-host {
				flex: 1;
				position: relative;
				min-height: 0;
			}
			/* Per-side debug toggles overlaid on each compare canvas. */
			.cmp-toggles {
				position: absolute;
				top: 8px;
				left: 8px;
				z-index: 5;
				display: flex;
				flex-wrap: wrap;
				gap: 4px;
				max-width: calc(100% - 16px);
			}
			.cmp-toggles button {
				font-size: 10px;
				padding: 2px 7px;
				background: rgba(12, 14, 20, 0.72);
				backdrop-filter: blur(2px);
			}
			.cmp-toggles button.off {
				opacity: 0.5;
			}
			/* Per-side observability tree, docked below each compare canvas and
               toggled from the column header. Reuses the .obsm-* tree styles. */
			.cmp-obs {
				display: none;
				flex-shrink: 0;
				height: 40%;
				overflow: auto;
				border-top: 1px solid var(--line);
				background: var(--panel);
				padding: 6px 8px;
				font-size: 11px;
			}
			.cmp-obs.open {
				display: block;
			}
			#compare-text {
				flex-shrink: 0;
				max-height: 40vh;
				overflow: auto;
				border-top: 1px solid var(--line);
				background: var(--panel);
				padding: 10px 12px;
				display: none;
			}
			#compare-text.open {
				display: block;
			}
			#compare-text .ct-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 10px;
			}
			#compare-text .ct-sec {
				margin-bottom: 10px;
			}
			#compare-text .ct-h {
				color: var(--text-faint);
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				margin-bottom: 3px;
			}
			#compare-text .ct-status {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: 11px;
				margin-bottom: 8px;
				padding-bottom: 8px;
				border-bottom: 1px solid var(--line);
			}
			/* The collapsed-by-default input/system diff expander: a toggle that
               reveals the diffs below the two outputs. */
			#compare-text .ct-expand {
				margin: 4px 0 0;
			}
			#compare-text .ct-diffs {
				margin-top: 8px;
				padding-top: 8px;
				border-top: 1px dashed var(--line);
			}
			.rc-pill {
				font-size: 10px;
				padding: 2px 9px;
				border: 1px solid var(--line);
				border-radius: 4px;
				color: var(--text-faint);
				cursor: pointer;
				user-select: none;
			}
			.rc-pill:hover {
				border-color: var(--accent-line);
			}
			.rc-pill.on {
				color: var(--accent);
				border-color: var(--accent-line);
				background: #16222e;
			}
			.rc-pill.rc-3d {
				margin-left: 8px;
			}
			.rc-pill.rc-3d.on {
				color: var(--purple);
				border-color: var(--purple);
				background: #221a2e;
			}
			.rv-card {
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--panel);
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}
			.rv-ab {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 8px;
			}
			/* 3D-grid mode: each card body becomes a live scene canvas. */
			.rv-3d {
				position: relative;
				height: 300px;
				background: #0c0d10;
				border-radius: 6px;
				overflow: hidden;
			}
			.rv-3d canvas {
				display: block;
			}
			.rv-ab .ab-h {
				color: var(--text-faint);
				font-size: 10px;
				margin-bottom: 2px;
			}
			.rv-ab .ab-edited .ab-h {
				color: var(--purple);
			}
			.rv-changed {
				color: var(--amber);
			}
			.rv-unchanged {
				color: var(--text-faint);
			}
			.rv-card .rv-head {
				display: flex;
				align-items: center;
				flex-wrap: wrap;
				gap: 8px 6px;
				padding: 8px 10px;
				background: var(--panel-2);
				border-bottom: 1px solid var(--line-2);
			}
			/* The per-event "simulate on" LLM picker — tinted so it reads as a
               distinct config affordance next to the plain action buttons. */
			.sim-llm-btn {
				color: var(--purple);
				border-color: rgba(168, 148, 255, 0.4);
			}
			/* Floating model-checkbox popover for the per-event LLM picker. */
			.model-pop {
				position: fixed;
				z-index: 200;
				background: var(--panel-2);
				border: 1px solid var(--line-2);
				border-radius: 6px;
				padding: 6px;
				min-width: 150px;
				max-height: 320px;
				overflow: auto;
				box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
			}
			.model-pop-head {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				color: var(--text-faint);
				margin-bottom: 5px;
			}
			.model-pop-head .fit-btn {
				margin-left: 0;
			}
			.model-pop-rows {
				display: flex;
				flex-direction: column;
				gap: 1px;
			}
			.model-pop-row {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: 11px;
				padding: 2px 3px;
				border-radius: 4px;
				cursor: pointer;
			}
			.model-pop-row:hover {
				background: rgba(255, 255, 255, 0.04);
			}
			.model-pop-row .muted {
				margin-left: auto;
				font-size: 9px;
			}
			.rv-card .rv-slot {
				font-weight: 600;
				color: var(--text);
			}
			.rv-card .rv-meta {
				color: var(--text-faint);
				font-size: 10px;
			}
			/* Sections stack vertically so each (input / output / system /
               reasoning) spans the card's full width — the visible set is
               chosen globally, and the outer grid's column count controls
               density, so the text you care about fills the available room. */
			.rv-card .rv-body {
				padding: 8px 10px;
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			.rv-card .rv-sec .lab {
				color: var(--text-faint);
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				margin-bottom: 3px;
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.rv-card .rv-sec pre {
				background: #0c0d10;
				border: 1px solid var(--line-2);
				border-radius: 5px;
				padding: 7px;
				max-height: 220px;
				overflow: auto;
			}
			.rv-card.err {
				border-color: #7a3f3f;
			}
			.rv-card .rv-loading {
				color: var(--text-faint);
				padding: 14px;
			}

			/* sim chips on lab cells */
			.sim-row {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 5px 8px;
				border: 1px solid var(--line-2);
				border-radius: 6px;
				margin: 5px 0;
			}
			.sim-row .cell-name {
				font-weight: 600;
				cursor: pointer;
			}
			.sim-row .cell-name:hover {
				color: var(--accent);
			}
			.sim-row .step-line {
				color: var(--text-faint);
				font-size: 10px;
				flex: 1;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.sim-row button {
				font-size: 10px;
				padding: 2px 8px;
			}

			/* ---------- modals + toasts ---------- */
			#modal-root .modal-back {
				position: fixed;
				inset: 0;
				background: rgba(8, 9, 12, 0.82);
				backdrop-filter: blur(4px);
				z-index: 120;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.modal-panel {
				width: min(460px, 92vw);
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 8px;
				overflow: hidden;
				/* Never exceed the viewport: stack header/body/footer so the body
                   scrolls and the footer (apply/cancel) stays reachable no matter
                   how much the body grows. */
				display: flex;
				flex-direction: column;
				max-height: 90vh;
			}
			.modal-panel header {
				display: flex;
				align-items: center;
				padding: 10px 14px;
				background: var(--panel-2);
				border-bottom: 1px solid var(--line);
				color: var(--accent);
				font-weight: 600;
				flex-shrink: 0;
			}
			.modal-panel header .x {
				margin-left: auto;
				cursor: pointer;
				color: var(--text-faint);
				font-size: 18px;
				line-height: 1;
			}
			.modal-panel header .x:hover {
				color: var(--text);
			}
			.modal-panel .m-body {
				padding: 14px;
				display: flex;
				flex-direction: column;
				gap: 10px;
				flex: 1 1 auto;
				min-height: 0;
				overflow: auto;
			}
			.modal-panel .m-field {
				display: flex;
				flex-direction: column;
				gap: 4px;
			}
			.modal-panel .m-field > span {
				color: var(--text-dim);
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
			}
			.modal-panel .m-hint {
				color: var(--text-faint);
				font-size: 11px;
			}
			.modal-panel .m-error {
				color: var(--red);
				font-size: 11px;
				min-height: 14px;
			}
			.modal-panel footer {
				display: flex;
				gap: 8px;
				justify-content: flex-end;
				padding: 10px 14px;
				background: var(--panel-2);
				border-top: 1px solid var(--line);
				flex-shrink: 0;
			}
			.check-grid {
				display: flex;
				flex-direction: column;
				gap: 3px;
				max-height: 40vh;
				overflow: auto;
			}
			.check-grid label {
				display: flex;
				gap: 8px;
				align-items: center;
				color: var(--text-dim);
				cursor: pointer;
			}

			/* per-slot selection tree: each slot is a block, expandable to its zones.
               Fills the modal body (filters pinned above, footer below) and is the
               sole scroll region, so every zone stays reachable however many slots
               are expanded. min-height:0 lets it shrink below content to scroll. */
			.m-field.sel-field {
				flex: 1 1 auto;
				min-height: 0;
			}
			.sel-tree {
				display: flex;
				flex-direction: column;
				gap: 4px;
				flex: 1 1 auto;
				min-height: 0;
				overflow: auto;
			}
			.sel-block {
				border: 1px solid var(--line);
				border-radius: 5px;
				overflow: hidden;
			}
			.sel-block.on {
				border-color: var(--accent-line);
			}
			.sel-slot {
				display: flex;
				gap: 8px;
				align-items: center;
				color: var(--text-dim);
				padding: 5px 7px;
			}
			.sel-slot .muted {
				font-size: 10px;
			}
			.sel-zones {
				display: flex;
				flex-direction: column;
				gap: 3px;
				padding: 6px 8px 7px 30px;
				border-top: 1px solid var(--line);
				background: var(--panel-2);
			}
			.sel-zones label {
				display: flex;
				gap: 8px;
				align-items: center;
				color: var(--text-dim);
				cursor: pointer;
			}
			.sel-zones .sel-all {
				color: var(--text);
			}

			#toast-root {
				position: fixed;
				bottom: 14px;
				left: 50%;
				transform: translateX(-50%);
				z-index: 200;
				display: flex;
				flex-direction: column;
				gap: 6px;
				align-items: center;
			}
			.toast {
				background: var(--panel-2);
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 7px 14px;
				color: var(--text-dim);
				max-width: 70vw;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.toast.err {
				border-color: #7a3f3f;
				color: var(--red);
			}
			.toast.ok {
				border-color: var(--green-line);
				color: var(--green);
			}
			/* Shared dock layout for every createObsDock() host — the overlay's
			   #obsdock keeps its own width/bg; each run-compare pane's .rc-obs
			   supplies sizing. Both are flex columns whose body scrolls. */
			.obsdock {
				display: flex;
				flex-direction: column;
				min-height: 0;
			}

			/* ---------- run-compare (same cell across two runs) ---------- */
			/* Two independent inspector panes, A = active run, B = compareRunB.
			   Read-only; each owns a viewer + a full observability dock. Sits
			   below the overlay so a pane can still be opened full there. */
			#btn-compare-runs.on {
				border-color: var(--purple);
				color: var(--purple);
				background: #221a2e;
			}
			#compare-run-b {
				display: none;
			}
			#compare-run-b.on {
				display: block;
			}
			#compare-run-b .run-combo-btn {
				max-width: 220px;
			}
			#runcompare {
				position: fixed;
				inset: 0;
				background: var(--bg);
				z-index: 96; /* above compare (95), below overlay (100) */
				display: none;
				flex-direction: column;
			}
			#runcompare.open {
				display: flex;
			}
			#runcompare-head {
				height: 46px;
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 0 12px;
				background: var(--panel-2);
				border-bottom: 1px solid var(--line);
				flex-shrink: 0;
			}
			#runcompare-head .title {
				color: var(--purple);
				font-weight: 600;
			}
			#runcompare-body {
				flex: 1;
				display: flex;
				min-height: 0;
			}
			.rc-col {
				flex: 1;
				min-width: 0;
				display: flex;
				flex-direction: column;
				border-right: 1px solid var(--line);
			}
			.rc-col:last-child {
				border-right: 0;
			}
			.rc-col-head {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 5px 12px;
				background: #14151a;
				border-bottom: 1px solid var(--line-2);
				font-size: 11px;
				flex-shrink: 0;
			}
			.rc-run-badge {
				font-weight: 600;
				padding: 1px 8px;
				border-radius: 4px;
				max-width: 45%;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				border: 1px solid var(--line);
			}
			.rc-run-badge.a {
				color: var(--accent);
				border-color: var(--accent-line);
			}
			.rc-run-badge.b {
				color: var(--green);
				border-color: var(--green-line);
			}
			.rc-status {
				color: var(--text-faint);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.rc-obs-toggle {
				letter-spacing: 0;
			}
			.rc-obs {
				height: 46%;
				flex-shrink: 0;
				border-top: 1px solid var(--line);
				background: var(--panel);
			}
			.rc-obs:not(.open) {
				display: none;
			}
			/* Generated-asset view controls (overlay toolbar) + per-object
			   regenerate / symmetry actions (trace panel) — from the hunyuan
			   generation + symmetry features. */
			#btn-asset-mode.on,
			#btn-asset-optimized.on {
				border-color: var(--accent);
				color: var(--accent);
			}
			#btn-generate {
				font-weight: 600;
			}
			.gen-status {
				font-size: 10px;
				color: var(--text-faint);
				align-self: center;
			}
			.tp-actions {
				display: flex;
				flex-direction: column;
				gap: 6px;
				margin-top: 4px;
				padding-top: 8px;
				border-top: 1px solid var(--line);
			}
			.tp-act-row {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 6px;
			}
			.tp-act-btn {
				font-size: 11px;
				padding: 3px 9px;
			}
			.tp-act-btn:disabled, .tp-act-sel:disabled {
				opacity: 0.35;
				cursor: not-allowed;
			}
			.tp-act-sel {
				font-size: 11px;
				padding: 2px 4px;
			}
			.tp-act-check {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				font-size: 10px;
				color: var(--text-dim);
			}
			.tp-act-sym {
				font-size: 10px;
				color: var(--text-faint);
			}
			.tp-img-prompt {
				font-size: 11px;
				line-height: 1.4;
				color: var(--text-dim);
				background: var(--bg-inset, rgba(0,0,0,0.15));
				border-radius: 4px;
				padding: 4px 6px;
				user-select: text;
			}
			/* Prefab group controls (link / unlink) — set off from the regenerate +
			   symmetry rows within the same generated-asset block. */
			.tp-prefab {
				display: flex;
				flex-direction: column;
				gap: 6px;
				margin-top: 2px;
				padding-top: 8px;
				border-top: 1px dashed var(--line);
			}
			/* Front-view (raw-mesh re-orientation) controls — set off like the prefab
			   block within the same generated-asset section. */
			.tp-frontview {
				display: flex;
				flex-direction: column;
				gap: 6px;
				margin-top: 2px;
				padding-top: 8px;
				border-top: 1px dashed var(--line);
			}
			/* Global mesh-generation queue panel: every in-flight + waiting
			   generation across the concurrency pools, from /trellis/queue. Shown
			   only over the cell overlay; queue.js pins `right` just left of the
			   observability dock (and the investigator when open) so it never
			   overlaps the obs tree. The `right` below is only the pre-JS fallback. */
			#queue-panel {
				position: fixed;
				right: 12px;
				bottom: 12px;
				width: 270px;
				max-height: 50vh;
				/* Hidden by default — the queue only floats over the main scene
				   canvas (the cell overlay), never on the board or in the prompt
				   lab, where it's just noise. Shown by the :has() rule below. */
				display: none;
				flex-direction: column;
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 8px;
				z-index: 105; /* above the overlay (100), below modals (120) */
				font-size: 12px;
				box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
				overflow: hidden;
			}
			/* Reveal it only while the main canvas (cell overlay) is up. Mirrors
			   the app's other context-scoped overlays (e.g. #canvas-host:has(...)). */
			body:has(#overlay.open) #queue-panel {
				display: flex;
			}
			#queue-head {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 7px 10px;
				cursor: pointer;
				user-select: none;
				flex-shrink: 0;
			}
			#queue-head .q-title {
				color: var(--text-dim);
				text-transform: uppercase;
				letter-spacing: 0.05em;
				font-size: 10px;
			}
			#queue-head .q-caret {
				color: var(--text-faint);
				font-size: 10px;
			}
			#queue-panel .q-count {
				margin-left: auto;
				min-width: 18px;
				text-align: center;
				color: var(--bg);
				background: var(--text-faint);
				border-radius: 999px;
				padding: 0 6px;
				font-variant-numeric: tabular-nums;
			}
			#queue-panel.busy .q-count {
				background: var(--accent);
			}
			#queue-body {
				display: none;
				overflow-y: auto;
				padding: 0 8px 8px;
			}
			#queue-panel.open #queue-body {
				display: block;
			}
			.q-empty {
				color: var(--text-faint);
				padding: 4px 2px 2px;
			}
			.q-section {
				margin-top: 6px;
			}
			.q-sec-head {
				display: flex;
				justify-content: space-between;
				color: var(--text-faint);
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				padding: 2px 0;
				border-bottom: 1px solid var(--line);
			}
			.q-row {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 3px 0;
			}
			.q-dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				flex-shrink: 0;
				background: var(--text-faint);
			}
			.q-dot.processing {
				background: var(--accent);
				animation: q-pulse 1.2s ease-in-out infinite;
			}
			.q-dot.waiting {
				background: var(--amber);
			}
			@keyframes q-pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.35;
				}
			}
			.q-job {
				flex: 1;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				color: var(--text);
			}
			.q-backend {
				color: var(--text-faint);
				font-size: 10px;
			}
			.q-state {
				color: var(--text-dim);
				font-size: 10px;
			}
			/* Reference image in the object viewer, beneath the 3D mini preview. */
			.tp-img-wrap {
				display: flex;
				flex-direction: column;
				gap: 2px;
			}
			.tp-preview-img {
				width: 100%;
				max-height: 220px;
				object-fit: contain;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: #0c0d10;
			}
			/* Per-object PBR texture maps (base color / roughness / metallic /
			   occlusion / normal / emissive), one thumbnail each, under the 3D
			   preview. Click a tile to span it full-width for a closer look. */
			.tp-maps {
				display: flex;
				flex-direction: column;
				gap: 4px;
			}
			.tp-maps-grid {
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				gap: 6px;
			}
			.tp-map {
				display: flex;
				flex-direction: column;
				gap: 2px;
				cursor: pointer;
			}
			.tp-map.big {
				grid-column: 1 / -1;
			}
			.tp-map-canvas {
				width: 100%;
				aspect-ratio: 1 / 1;
				object-fit: contain;
				border: 1px solid var(--line);
				border-radius: 4px;
				background: #0c0d10;
			}
			.tp-map-lab {
				color: var(--text-faint);
				font-size: 9px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
			}
			/* Lighting panel — opened from the ☀ light toggle in #viewer-toggles;
			   floats bottom-left over the canvas, shifting clear of the trace panel. */
			#lighting-panel {
				position: absolute;
				left: 10px;
				bottom: 46px;
				width: 230px;
				display: none;
				flex-direction: column;
				gap: 6px;
				padding: 10px;
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 8px;
				z-index: 8;
				transition: left 0.2s ease;
			}
			#lighting-panel.open {
				display: flex;
			}
			#canvas-host:has(#trace-panel.open) #lighting-panel {
				left: calc(var(--trace-w) + 16px);
			}
			#lighting-panel .lp-head {
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			#lighting-panel .lp-title {
				color: var(--text-dim);
				text-transform: uppercase;
				letter-spacing: 0.05em;
				font-size: 10px;
			}
			#lighting-panel .lp-reset {
				font-size: 10px;
				padding: 2px 7px;
			}
			.lp-row {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: 11px;
			}
			.lp-row .lp-lab {
				flex: 0 0 78px;
				color: var(--text-faint);
			}
			.lp-row .lp-slider {
				flex: 1;
				min-width: 0;
			}
			.lp-row .lp-val {
				flex: 0 0 38px;
				text-align: right;
				color: var(--text-dim);
				font-variant-numeric: tabular-nums;
			}
			.lp-row.lp-check {
				gap: 8px;
				color: var(--text-dim);
				margin-top: 2px;
			}
			#btn-lighting.on {
				border-color: var(--accent);
				color: var(--accent);
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "/vendor/three/build/three.module.js",
					"three/addons/": "/vendor/three/examples/jsm/"
				}
			}
		</script>
	</head>
	<body>
		<div id="topbar">
			<span class="brand">starshot</span>
			<div id="run-picker" class="run-combo"></div>
			<button
				id="btn-new-run"
				title="Create a new run from a prompt version"
			>
				+ new run
			</button>
			<button
				id="btn-start-cells"
				title="Start model × slot cells on this run"
			>
				start cells…
			</button>
			<button
				id="btn-reset-all"
				class="danger"
				title="Wipe every started cell on this run back to idle (deletes their events + meshes). Nothing is restarted."
			>
				reset all
			</button>
			<button
				id="btn-select"
				title="Select multiple cells, then resume / reset / step / pause them all at once"
			>
				select
			</button>
			<span class="sep"></span>
			<button
				id="btn-lab"
				class="primary"
				title="Edit a prompt template, test it against logged events, and simulate downstream"
			>
				modify prompts
			</button>
			<button
				id="btn-step-all"
				style="display: none"
				title="Advance every waiting slot by exactly one step"
			>
				step all
			</button>
			<button
				id="btn-board-view"
				title="Toggle between the status cards and a grid of live 3D scenes for every active run"
			>
				scenes ▦
			</button>
			<button
				id="btn-compare-runs"
				title="Compare a cell across two runs side by side"
			>
				compare runs
			</button>
			<div
				id="compare-run-b"
				class="run-combo"
				title="The run to compare the active run against"
			></div>
			<button
				id="btn-ab-test"
				title="Launch a new run (Run B) seeded with this run's zone plans, re-running from the zone plan onwards on a chosen prompt version"
			>
				A/B test…
			</button>
			<button
				id="btn-copy-slot"
				title="Copy a slot from this run into another run, overwriting that run's slot"
			>
				copy slot…
			</button>
			<span id="status-text"></span>
			<div id="cost-tracker" class="collapsed">
				<button
					id="cost-pill"
					type="button"
					title="Actual OpenRouter spend for this run — each call's billed cost from OpenRouter's /generation endpoint, so it matches OpenRouter's activity log. Costs settle shortly after each call; 'N resolving' is how many are still pending (0 = fully caught up, safe to shut down). Click to break it down by slot and model."
				>
					<span class="cost-caret"></span>
					<span class="cost-pill-label">spend</span>
					<span class="cost-pill-summary">$0.00 · 0 req</span>
				</button>
				<div id="cost-dropdown"></div>
			</div>
		</div>
		<div id="board">
			<div id="board-plane"><div id="board-grid"></div></div>
		</div>
		<div id="board-scenes"></div>
		<button id="scene-add-fab" title="add a slot's 3D scene to the grid">
			+ add slot
		</button>
		<div id="obs-drawer">
			<div id="obs-drawer-head">
				<span class="title" id="obs-drawer-title"></span>
				<span class="muted" id="obs-drawer-sub"></span>
				<button id="obs-drawer-close" style="margin-left: auto">
					close ✕
				</button>
			</div>
			<div id="obs-drawer-body"></div>
		</div>
		<div id="overlay">
			<div id="overlay-head">
				<button id="overlay-close" title="Back to the board (Esc)">
					← board
				</button>
				<span class="title" id="overlay-title"></span>
				<span class="crumbs" id="overlay-crumbs"></span>
				<span class="sep"></span>
				<span class="dot idle" id="overlay-dot"></span>
				<span id="overlay-status" class="muted"></span>
				<span style="margin-left: auto"></span>
				<button id="overlay-action"></button>
				<button id="overlay-reset" class="danger">reset</button>
				<button
					id="overlay-investigate"
					class="inv-toggle"
					title="Open the scene investigator — ask an AI (Opus 4.8) holistic questions about this cell's whole scene"
				>
					investigate ✦
				</button>
			</div>
			<div id="overlay-body">
				<div id="canvas-host">
					<div id="viewer-toggles">
						<!-- objects multiselect (anchors/next/negative space/frames) is
						     inserted here by overlay.js via buildObjectsMenu() -->
						<button data-toggle="zones">zones</button>
						<button data-toggle="meshes">meshes</button>
						<button data-toggle="grid">grid</button>
						<button data-toggle="bboxes">bboxes</button>
						<button
							data-toggle="proxies"
							title="show the collision-proxy wireframes (sphere / capsule / hemisphere) — hidden by default"
						>
							proxies
						</button>
						<button
							id="btn-zone-layers"
							class="off"
							title="Zone layers — show only zone bounding boxes, each nesting depth a different colour; toggle layer chips (multi-select) to isolate them"
						>
							zone layers
						</button>
						<button id="btn-unhide-all" title="un-hide every manually hidden object / zone">unhide all</button>
						<button id="btn-refit">refit</button>
					</div>
					<div id="zone-layers-legend" style="display: none"></div>
					<!-- Selection-driven emittance-trace inspector; filled +
					     slid in by tracepanel.js when a node is picked in 3D. -->
					<div id="trace-panel"></div>
				</div>
				<div
					id="obsdock-resizer"
					title="drag to resize the observability panel"
				></div>
				<div id="obsdock" style="position: relative">
					<div id="obsdock-head">
						<span>observability</span>
						<span id="obs-count" class="muted"></span>
					</div>
					<div id="obs-pinned"></div>
					<div id="obs-body"></div>
					<div id="obs-log">
						<div id="obs-log-head">
							<span class="caret">▸</span>
							<span>log</span>
							<span id="obs-log-counts" class="muted"></span>
						</div>
						<div id="obs-log-body"></div>
					</div>
				</div>
				<div
					id="investigator-resizer"
					title="drag to resize the investigator"
					style="display: none"
				></div>
				<!-- Per-slot investigator chat; built + driven by investigator.js,
				     toggled from the header (#overlay-investigate). -->
				<div id="investigator" class="investigator"></div>
			</div>
		</div>
		<div id="lab">
			<div id="lab-head">
				<button id="lab-close">← board</button>
				<span class="title">prompt lab</span>
				<span class="muted" id="lab-run"></span>
				<span class="sep"></span>
				<button
					id="lab-select"
					title="Filter and pick the slots + zones to iterate on — they show as live debug canvases on the right"
				>
					select slots / zones…
				</button>
				<span class="muted" id="lab-sel-summary"></span>
				<span style="margin-left: auto"></span>
				<button
					id="lab-apply"
					class="primary"
					title="Write the edited templates into THIS run's snapshot and optionally re-run a step across all slots — the in-place iteration loop"
				>
					apply to run…
				</button>
				<button id="lab-save-version">save to new version</button>
				<button id="lab-save-run">save to new run</button>
			</div>
			<div id="lab-body">
				<div id="lab-steps"></div>
				<div id="lab-editor">
					<div class="ed-label">
						variables
						<span class="muted"
							>(click to insert — they render at call time; scene
							context stays a token here)</span
						>
					</div>
					<div id="lab-vars"></div>
					<div class="ed-label" id="lab-sys-label">
						system template
					</div>
					<textarea id="lab-sys" spellcheck="false"></textarea>
					<div class="ed-label" id="lab-usr-label">user template</div>
					<textarea id="lab-usr" spellcheck="false"></textarea>
				</div>
				<div
					id="lab-resizer"
					title="drag to resize the debug panel"
				></div>
				<div id="lab-right">
					<div class="pane-head">
						<span id="lab-right-title"
							>debug · <span id="lab-grid-step"></span
						></span>
						<span id="lab-grid-count" class="muted"></span>
						<span class="rc-label">show</span>
						<div id="lab-sections"></div>
						<span class="rc-label">cols</span>
						<select id="lab-cols" title="how many cards per row">
							<option value="1">1</option>
							<option value="2">2</option>
							<option value="3">3</option>
							<option value="4">4</option>
						</select>
						<button
							id="lab-ev-refresh"
							style="
								margin-left: auto;
								font-size: 10px;
								padding: 2px 8px;
							"
							title="reload this step's events"
						>
							refresh
						</button>
						<button
							id="lab-step-all"
							style="
								display: none;
								font-size: 10px;
								padding: 2px 8px;
							"
							title="Advance every stepped cell one LLM call, then follow it in the lab"
						>
							step all
						</button>
					</div>
					<div id="lab-grid"></div>
					<div id="lab-actions">
						<span class="count" id="lab-sel-count">0 selected</span>
						<span class="muted" id="lab-test-summary"></span>
						<button
							id="lab-test"
							class="primary"
							title="Run the current prompt edit on every selected slot/zone and highlight the difference"
						>
							test edits on selected
						</button>
						<button id="lab-simulate">simulate downstream</button>
					</div>
				</div>
			</div>
		</div>
		<div id="compare">
			<div id="compare-head">
				<button id="compare-close">← back</button>
				<span class="title"
					>compare · <span id="compare-title"></span
				></span>
				<span class="muted" id="compare-sub"></span>
				<span style="margin-left: auto"></span>
				<button
					id="compare-sync"
					title="Align the previous view to the current view"
				>
					sync views ⟳
				</button>
				<label class="cmp-link" title="Move both cameras together"
					><input id="compare-link" type="checkbox" checked /> link
					cameras</label
				>
				<button
					id="compare-text-toggle"
					title="Show the two outputs (input / system diff on expand)"
				>
					text ▾
				</button>
			</div>
			<div id="compare-body">
				<div class="cmp-col">
					<div class="cmp-col-head prev" id="cmp-prev-head">
						<span class="cmp-head-text">◀ previous · original</span>
					</div>
					<div id="cmp-prev-host" class="cmp-host"></div>
					<div id="cmp-prev-obs" class="cmp-obs"></div>
				</div>
				<div class="cmp-col">
					<div class="cmp-col-head cur" id="cmp-cur-head">
						<span class="cmp-head-text"
							>current · simulated edit ▶</span
						>
					</div>
					<div id="cmp-cur-host" class="cmp-host"></div>
					<div id="cmp-cur-obs" class="cmp-obs"></div>
				</div>
			</div>
			<div id="compare-text"></div>
		</div>
		<div id="runcompare">
			<div id="runcompare-head">
				<button id="runcompare-close" title="Back to the board (Esc)">
					← board
				</button>
				<span class="title"
					>compare runs · <span id="runcompare-title"></span
				></span>
				<span class="muted" id="runcompare-sub"></span>
				<span style="margin-left: auto"></span>
				<button
					id="runcompare-sync"
					title="Align both views to the left (A) camera"
				>
					sync views ⟳
				</button>
				<label class="cmp-link" title="Move both cameras together"
					><input id="runcompare-link" type="checkbox" checked /> link
					cameras</label
				>
				<button
					id="rc-investigate"
					class="inv-toggle"
					title="Open the scene investigator for a pane's cell — ask an AI (Opus 4.8) about its whole scene"
				>
					investigate ✦
				</button>
			</div>
			<div id="runcompare-body">
				<div class="rc-col">
					<div class="rc-col-head">
						<span class="rc-run-badge a" id="rc-a-run"></span>
						<span class="dot idle" id="rc-a-dot"></span>
						<span class="rc-status" id="rc-a-status"></span>
						<span style="margin-left: auto"></span>
						<button
							class="cmp-step-btn rc-obs-toggle"
							id="rc-a-obs-toggle"
							title="show/hide this side's observability dock"
						>
							obs ▴
						</button>
					</div>
					<div id="rc-a-host" class="cmp-host"></div>
					<div id="rc-a-obs" class="rc-obs open"></div>
				</div>
				<div class="rc-col">
					<div class="rc-col-head">
						<span class="rc-run-badge b" id="rc-b-run"></span>
						<span class="dot idle" id="rc-b-dot"></span>
						<span class="rc-status" id="rc-b-status"></span>
						<span style="margin-left: auto"></span>
						<button
							class="cmp-step-btn rc-obs-toggle"
							id="rc-b-obs-toggle"
							title="show/hide this side's observability dock"
						>
							obs ▴
						</button>
					</div>
					<div id="rc-b-host" class="cmp-host"></div>
					<div id="rc-b-obs" class="rc-obs open"></div>
				</div>
				<!-- Scene investigator for run-compare; bound per-pane on "why?"
				     (see runcompare.js), toggled from #rc-investigate. -->
				<div id="rc-investigator" class="investigator"></div>
			</div>
		</div>
		<div id="modal-root"></div>
		<div id="toast-root"></div>
		<script type="module" src="/js/main.js"></script>
	</body>
</html>

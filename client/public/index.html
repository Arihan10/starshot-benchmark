<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="server-url" content="http://127.0.0.1:8765" />
        <title>starshot · prompt bench</title>
        <style>
            :root {
                --bg: #101114;
                --panel: #16181d;
                --panel-2: #1c1e24;
                --line: #2a2d35;
                --line-2: #23262e;
                --text: #e6e6e6;
                --text-dim: #b8bcc4;
                --text-faint: #7a808c;
                --accent: #9ad4ff;
                --accent-line: #4a8fd8;
                --green: #8bd17c;
                --green-line: #3f7a52;
                --red: #ff8080;
                --amber: #e0c271;
                --orange: #e09050;
                --purple: #c9a6ff;
            }
            * { box-sizing: border-box; }
            html, body { height: 100%; }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font: 12px/1.45 "SF Mono", ui-monospace, Menlo, monospace;
                overflow: hidden;
            }
            button {
                font: inherit;
                color: var(--text-dim);
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 4px;
                padding: 5px 10px;
                cursor: pointer;
                white-space: nowrap;
            }
            button:hover:not(:disabled) { border-color: var(--accent-line); color: #c8d8f0; }
            button:disabled { opacity: 0.45; cursor: default; }
            button.primary {
                border-color: var(--green-line);
                background: #1d2c22;
                color: #c9f0d6;
            }
            button.primary:hover:not(:disabled) { background: #244e34; border-color: #4faf6e; }
            button.danger { border-color: #7a3f3f; background: #2c1d1d; color: #f0c9c9; }
            button.danger:hover:not(:disabled) { background: #4e2424; border-color: #af4f4f; }
            select, input[type="text"], textarea {
                font: inherit;
                color: var(--text);
                background: #0c0d10;
                border: 1px solid var(--line);
                border-radius: 4px;
                padding: 6px 8px;
            }
            select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent-line); }
            pre {
                margin: 0;
                white-space: pre-wrap;
                word-break: break-word;
                font: 11px/1.5 "SF Mono", ui-monospace, Menlo, monospace;
            }
            .muted { color: var(--text-faint); }
            .fit-btn { font-size: 10px; padding: 1px 7px; flex-shrink: 0; }
            pre.fit-full { max-height: none !important; }
            /* folded scene-context placeholder inside an obs prompt <pre> */
            .ctx-fold-btn {
                color: var(--accent); cursor: pointer; font-style: italic;
                opacity: 0.85; border-bottom: 1px dotted var(--accent-line);
            }
            .ctx-fold-btn:hover { opacity: 1; }
            pre.diff .diff-ins { background: rgba(63, 122, 82, 0.4); color: #c9f0d6; }
            pre.diff .diff-del { background: rgba(122, 63, 63, 0.4); color: #f0c9c9; text-decoration: line-through; }
            .dot {
                display: inline-block;
                width: 8px; height: 8px;
                border-radius: 50%;
                background: #5a5e68;
                flex-shrink: 0;
            }
            .dot.running { background: var(--amber); }
            .dot.done    { background: var(--green); }
            .dot.error   { background: var(--red); }
            .dot.paused  { background: var(--orange); }
            .dot.idle    { background: #5a5e68; }

            /* ---------- topbar ---------- */
            #topbar {
                position: fixed;
                inset: 0 0 auto 0;
                height: 46px;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 12px;
                background: var(--panel-2);
                border-bottom: 1px solid var(--line);
                z-index: 40;
            }
            #topbar .brand { color: var(--accent); font-weight: 600; margin-right: 6px; }
            #topbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
            #topbar #status-text {
                margin-left: auto;
                color: var(--text-faint);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            #run-picker { max-width: 320px; }

            /* ---------- board ---------- */
            #board {
                position: fixed;
                inset: 46px 0 0 0;
                overflow: hidden;
                cursor: grab;
            }
            #board.panning { cursor: grabbing; }
            /* "scenes" board view: a responsive grid of live 3D canvases, one
               per active run, for at-a-glance comparison across slots/models. */
            #board-scenes {
                position: fixed;
                inset: 46px 0 0 0;
                overflow: hidden;
                padding: 16px;
                display: none;
                grid-template-columns: 1fr;
                gap: 14px;
            }
            #board-scenes.open { display: grid; }
            #board-scenes .scene-empty { color: var(--text-faint); padding: 24px; grid-column: 1 / -1; }
            .scene-tile {
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--panel);
                overflow: hidden;
                display: flex;
                flex-direction: column;
                min-height: 0; /* shrink to its grid cell so the whole set fits */
            }
            .scene-tile-head {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 10px;
                background: var(--panel-2);
                border-bottom: 1px solid var(--line-2);
                cursor: pointer;
                font-size: 12px;
            }
            .scene-tile-head:hover { background: #232730; }
            .scene-tile-name { font-weight: 600; color: var(--text); }
            .scene-tile-model { color: var(--text-faint); font-size: 11px; }
            .scene-tile-status {
                margin-left: auto;
                color: var(--text-faint);
                font-size: 10px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 55%;
            }
            .scene-tile-host { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #0c0d10; }
            .scene-tile-x {
                font-size: 11px; padding: 0 6px; line-height: 1.6;
                color: var(--text-faint); border: 1px solid var(--line);
                border-radius: 4px; background: transparent; cursor: pointer; flex-shrink: 0;
            }
            .scene-tile-x:hover { color: #f0c9c9; border-color: #7a3f3f; background: rgba(122, 63, 63, 0.28); }
            /* floating "+ add slot" launcher for the scenes grid */
            #scene-add-fab {
                position: fixed; bottom: 18px; left: 18px; z-index: 45; display: none;
                font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 20px;
                background: var(--panel-2); color: var(--accent);
                border: 1px solid var(--accent-line); cursor: pointer;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            }
            #scene-add-fab.open { display: block; }
            #scene-add-fab:hover { background: #16222e; }
            .scene-add-list { max-height: 50vh; overflow: auto; display: flex; flex-direction: column; gap: 3px; }
            .scene-add-row {
                display: flex; align-items: center; gap: 8px; text-align: left;
                padding: 5px 8px; background: var(--panel-2); border: 1px solid var(--line);
                border-radius: 5px; cursor: pointer; color: var(--text-dim); font-size: 12px;
            }
            .scene-add-row:hover { border-color: var(--accent-line); background: #16222e; }
            .scene-add-name { font-weight: 600; color: var(--text); }
            .scene-add-model { color: var(--text-faint); font-size: 11px; }
            .scene-add-row .muted { margin-left: auto; }
            /* Mini observability pipeline overlaid on each tile's canvas. */
            .obsm-mini {
                position: absolute;
                left: 0; top: 0; bottom: 0;
                width: min(44%, 168px);
                overflow: auto;
                padding: 4px 6px;
                font-size: 10px;
                background: rgba(8, 9, 12, 0.6);
                border-right: 1px solid var(--line-2);
                cursor: pointer;
                backdrop-filter: blur(2px);
            }
            .obsm-mini:hover { background: rgba(12, 14, 20, 0.78); }
            .obsm-mini .obsm-mini-head {
                display: flex; align-items: center; gap: 4px;
                color: var(--text-faint); font-size: 9px; text-transform: uppercase;
                letter-spacing: 0.04em; margin-bottom: 3px;
            }
            /* obsm tree (shared by the mini panel + the right drawer) */
            .obsm-row { display: flex; align-items: center; gap: 5px; padding: 1px 0; }
            .obsm-id { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .obsm-phase { color: var(--text-faint); font-size: 0.85em; margin-left: auto; flex-shrink: 0; }
            .obsm-empty { color: var(--text-faint); padding: 4px; }
            .obsm-calls { margin-left: 9px; border-left: 1px solid var(--line-2); padding-left: 6px; }
            .obsm-call { display: flex; align-items: center; gap: 5px; padding: 1px 0; cursor: pointer; color: var(--text-faint); }
            .obsm-call:hover { color: var(--text-dim); }
            .obsm-call .step-badge { color: var(--accent); }
            .obsm-call .caret { width: 9px; flex-shrink: 0; }
            .obsm-detail { margin: 2px 0 4px 14px; }
            .obsm-sec { margin-bottom: 5px; }
            .obsm-sec-lab { color: var(--text-faint); font-size: 0.85em; margin-bottom: 2px; }
            .obsm-detail pre {
                margin: 0; white-space: pre-wrap; word-break: break-word;
                max-height: 220px; overflow: auto;
                background: var(--panel-2); border: 1px solid var(--line-2);
                border-radius: 4px; padding: 5px;
            }
            /* Right-side observability drawer (opened from a tile's mini tree). */
            #obs-drawer {
                position: fixed;
                top: 46px; right: 0; bottom: 0;
                width: min(460px, 42vw);
                background: var(--panel);
                border-left: 1px solid var(--line);
                box-shadow: -8px 0 24px rgba(0, 0, 0, 0.4);
                z-index: 50;
                display: none;
                flex-direction: column;
            }
            #obs-drawer.open { display: flex; }
            #obs-drawer-head {
                display: flex; align-items: center; gap: 8px;
                padding: 8px 12px; background: var(--panel-2);
                border-bottom: 1px solid var(--line); flex-shrink: 0;
            }
            #obs-drawer-head .title { color: var(--purple); font-weight: 600; }
            #obs-drawer-body { flex: 1; overflow: auto; padding: 10px 12px; font-size: 12px; }
            /* obs drawer: clickable node rows + the per-object emit trace. */
            .obsm-row.clickable { cursor: pointer; border-radius: 4px; }
            .obsm-row.clickable:hover { background: #1d2027; }
            .obsm-call.emits .step-badge { border-color: var(--amber); color: var(--amber); }
            .obsm-call .emit-badge {
                color: var(--amber); font-size: 9px; padding: 0 5px;
                border: 1px solid #5a4d2a; border-radius: 3px; white-space: nowrap;
            }
            .obsm-trace-head {
                display: flex; flex-direction: column; gap: 6px;
                margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line-2);
            }
            .obsm-back { align-self: flex-start; font-size: 11px; padding: 2px 9px; }
            .obsm-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 11px; }
            .obsm-crumb { color: var(--text-dim); cursor: pointer; }
            .obsm-crumb:hover { color: var(--accent); }
            .obsm-crumb.cur { color: var(--purple); font-weight: 600; cursor: default; }
            .obsm-crumb-sep { color: var(--text-faint); }
            .obsm-trace-node { margin-bottom: 10px; }
            .obsm-trace-node.focus > .obsm-row { background: rgba(201, 166, 255, 0.12); border-radius: 4px; padding: 2px 4px; }
            #board-plane {
                position: absolute;
                transform-origin: 0 0;
                padding: 28px;
            }
            #board-grid {
                display: grid;
                gap: 14px;
            }
            .grid-head {
                color: var(--text-faint);
                font-size: 11px;
                display: flex;
                align-items: flex-end;
                padding: 4px 6px;
                user-select: none;
            }
            .grid-head.col { justify-content: center; color: var(--accent); }
            .cell-card {
                width: 230px;
                min-height: 96px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 9px 11px;
                display: flex;
                flex-direction: column;
                gap: 5px;
                cursor: pointer;
                user-select: none;
            }
            .cell-card:hover { border-color: var(--accent-line); }
            .cell-card .head { display: flex; align-items: center; gap: 7px; }
            .cell-card .slot-name {
                font-weight: 600;
                color: var(--text);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .cell-card .step-line {
                color: var(--text-dim);
                font-size: 11px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .cell-card .meta-line { color: var(--text-faint); font-size: 10px; }
            .cell-card .branch-chip {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-top: 2px;
                padding: 4px 7px;
                border: 1px dashed #5a4a8a;
                border-radius: 5px;
                color: var(--purple);
                font-size: 10px;
            }
            .cell-card.empty { opacity: 0.45; }
            .cell-card.sim-dim { opacity: 0.3; }
            .cell-card .step-mode-tag {
                margin-left: auto;
                font-size: 9px;
                color: var(--amber);
                border: 1px solid #5a4d2a;
                border-radius: 3px;
                padding: 0 5px;
                white-space: nowrap;
            }
            /* "step (all) until <step>" picker — sits next to step / step-all. */
            select.step-until {
                font-size: 11px;
                padding: 3px 6px;
                max-width: 160px;
                background: var(--panel-2);
                color: var(--text-dim);
                border: 1px solid var(--line);
                border-radius: 5px;
                cursor: pointer;
            }
            select.step-until:hover { border-color: var(--accent-line); }

            /* ---------- overlay (cell view) ---------- */
            #overlay {
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 90; /* above the prompt lab so sim cells can be inspected from it */
                display: flex;
                flex-direction: column;
                transform: translateX(100%);
                transition: transform 0.22s ease;
            }
            #overlay.open { transform: translateX(0); }
            #overlay-head {
                height: 46px;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 12px;
                background: var(--panel-2);
                border-bottom: 1px solid var(--line);
                flex-shrink: 0;
            }
            #overlay-head .title { font-weight: 600; color: var(--accent); }
            #overlay-head .crumbs { color: var(--text-faint); }
            #overlay-status {
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            #overlay-status.is-error { color: var(--red); }
            #overlay-body { flex: 1; display: flex; min-height: 0; }
            #canvas-host { flex: 1; position: relative; min-width: 0; }
            #canvas-host canvas { display: block; }
            #viewer-toggles {
                position: absolute;
                left: 10px;
                bottom: 10px;
                display: flex;
                gap: 6px;
                z-index: 5;
            }
            #viewer-toggles button { font-size: 10px; padding: 3px 8px; }
            #viewer-toggles button.off { opacity: 0.5; }

            /* ---------- observability dock ---------- */
            #obsdock-resizer {
                width: 7px;
                flex-shrink: 0;
                cursor: col-resize;
                position: relative;
                z-index: 6;
                touch-action: none;
            }
            #obsdock-resizer::before {
                content: "";
                position: absolute;
                top: 0;
                bottom: 0;
                left: 3px;
                width: 1px;
                background: var(--line);
            }
            #obsdock-resizer:hover::before,
            #obsdock-resizer.dragging::before {
                left: 2px;
                width: 3px;
                background: var(--accent-line);
            }
            #obsdock {
                width: 480px;
                flex-shrink: 0;
                background: var(--panel);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            #obsdock-head {
                padding: 8px 12px;
                border-bottom: 1px solid var(--line-2);
                display: flex;
                align-items: center;
                gap: 8px;
                color: var(--text-dim);
                flex-shrink: 0;
            }
            #obs-pinned {
                border-bottom: 1px solid var(--line);
                background: #191527;
                padding: 9px 12px;
                flex-shrink: 0;
                max-height: 34vh;
                overflow: auto;
                display: none;
            }
            #obs-pinned.visible { display: block; }
            #obs-pinned .pin-label {
                color: var(--purple);
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 6px;
                display: flex;
                gap: 8px;
                align-items: center;
            }
            #obs-pinned .pin-section { margin: 6px 0; }
            #obs-pinned .pin-section > .lab {
                color: var(--text-faint);
                font-size: 10px;
                margin-bottom: 2px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            #obs-pinned pre { max-height: 110px; overflow: auto; background: #0c0d10; padding: 6px; border-radius: 4px; }
            #obs-body { flex: 1; overflow: auto; padding: 8px 0; }

            #obs-log {
                flex-shrink: 0;
                border-top: 1px solid var(--line);
                background: #14151a;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            #obs-log-head {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 12px;
                color: var(--text-dim);
                cursor: pointer;
                user-select: none;
                flex-shrink: 0;
            }
            #obs-log-head:hover { color: var(--text); }
            #obs-log-head .caret { color: var(--text-faint); width: 10px; }
            #obs-log.open #obs-log-head .caret { transform: rotate(90deg); }
            #obs-log-counts.has-errors { color: var(--red); }
            #obs-log-body {
                display: none;
                overflow: auto;
                max-height: 30vh;
                padding: 2px 0 8px 0;
            }
            #obs-log.open #obs-log-body { display: block; }
            .log-row {
                display: flex;
                gap: 8px;
                padding: 2px 12px;
                font-size: 11px;
                color: var(--text-dim);
                align-items: baseline;
            }
            .log-row .idx { color: var(--text-faint); min-width: 38px; text-align: right; flex-shrink: 0; }
            .log-row .kind { color: var(--text-faint); flex-shrink: 0; }
            .log-row .msg { white-space: pre-wrap; word-break: break-word; }
            .log-row.error { color: #ffb3b3; background: rgba(122, 63, 63, 0.12); }
            .log-row.error .kind { color: var(--red); }
            .log-row.warn .kind { color: var(--amber); }
            .log-row.info .kind { color: var(--accent); }

            .obs-node { margin: 0 8px 6px 8px; }
            .obs-node > .node-row {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 4px 6px;
                border-radius: 4px;
                color: var(--text-dim);
                cursor: pointer;
            }
            .obs-node > .node-row:hover { background: #1d2027; }
            .obs-node > .node-row.selected {
                background: #123034;
                outline: 1px solid #4af0e0;
                color: #c8f5ef;
            }
            .obs-node > .node-row.hidden-node { opacity: 0.45; }
            .obs-node .node-eye {
                margin-left: auto;
                padding: 0 5px;
                font-size: 11px;
                line-height: 1.3;
                background: none;
                border: none;
                opacity: 0;
            }
            .obs-node > .node-row:hover .node-eye,
            .obs-node > .node-row.hidden-node .node-eye { opacity: 0.8; }
            .obs-node .node-eye:hover { opacity: 1 !important; }
            .obs-node .node-id { font-weight: 600; }
            .obs-node .node-kind { color: var(--text-faint); font-size: 10px; }
            .obs-calls { margin-left: 14px; border-left: 1px solid var(--line-2); padding-left: 8px; }
            .obs-call {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 3px 6px;
                border-radius: 4px;
                cursor: pointer;
                color: var(--text-dim);
            }
            .obs-call:hover { background: #1d2027; }
            .obs-call .step-badge {
                font-size: 10px;
                padding: 1px 6px;
                border-radius: 3px;
                border: 1px solid var(--line);
                color: var(--accent);
                white-space: nowrap;
            }
            .obs-call.hl .step-badge { border-color: #5a4a8a; color: var(--purple); }
            .obs-call .call-meta { color: var(--text-faint); font-size: 10px; margin-left: auto; white-space: nowrap; }
            .obs-call.seeded .step-badge { border-style: dashed; }
            .obs-call .call-caret { color: var(--text-faint); width: 9px; flex-shrink: 0; }
            .obs-call.open { background: #1d2027; }
            /* "revert to here" on a call row (obs dock + scenes drawer). */
            .call-revert {
                font-size: 9px;
                padding: 1px 6px;
                color: var(--text-faint);
                border: 1px solid var(--line);
                border-radius: 4px;
                background: transparent;
                white-space: nowrap;
                flex-shrink: 0;
                cursor: pointer;
            }
            .call-revert:hover { color: #f0c9c9; border-color: #7a3f3f; background: rgba(122, 63, 63, 0.28); }
            .obsm-call .call-revert { margin-left: auto; }
            /* obs dock emit-trace mode (root → object lineage of one node). */
            .obs-call.emits .step-badge { border-color: var(--amber); color: var(--amber); }
            .obs-call .emit-badge {
                color: var(--amber); font-size: 9px; padding: 0 5px;
                border: 1px solid #5a4d2a; border-radius: 3px; white-space: nowrap;
            }
            .obs-trace-head {
                display: flex; flex-direction: column; gap: 6px;
                margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line-2);
            }
            .obs-back { align-self: flex-start; font-size: 11px; padding: 2px 9px; }
            .obs-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 11px; }
            .obs-crumb { color: var(--text-dim); cursor: pointer; }
            .obs-crumb:hover { color: var(--accent); }
            .obs-crumb.cur { color: var(--purple); font-weight: 600; cursor: default; }
            .obs-crumb-sep { color: var(--text-faint); }
            .obs-node.trace-focus > .node-row { background: rgba(201, 166, 255, 0.12); }
            .call-detail {
                margin: 2px 0 8px 16px;
                padding: 8px 10px;
                border: 1px solid var(--line-2);
                border-radius: 6px;
                background: #121319;
            }
            .call-detail .detail-section { margin-bottom: 8px; }
            .call-detail .detail-section:last-child { margin-bottom: 0; }
            .call-detail .detail-section pre { max-height: 240px; }

            .detail-section { margin-bottom: 12px; }
            .detail-section > .lab {
                color: var(--text-faint);
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 4px;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .detail-section pre {
                background: #0c0d10;
                border: 1px solid var(--line-2);
                border-radius: 5px;
                padding: 8px;
                max-height: 320px;
                overflow: auto;
            }
            .var-row { border: 1px solid var(--line-2); border-radius: 5px; margin-bottom: 4px; }
            .var-row > .var-head {
                display: flex;
                gap: 8px;
                padding: 4px 8px;
                cursor: pointer;
                color: var(--purple);
            }
            .var-row > .var-head .size { margin-left: auto; color: var(--text-faint); }
            .var-row pre { display: none; border: 0; border-top: 1px solid var(--line-2); border-radius: 0 0 5px 5px; }
            .var-row.open pre { display: block; }

            /* ---------- prompt lab ---------- */
            #lab {
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 80;
                display: none;
                flex-direction: column;
            }
            #lab.open { display: flex; }
            #lab-head {
                height: 46px;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 12px;
                background: var(--panel-2);
                border-bottom: 1px solid var(--line);
                flex-shrink: 0;
            }
            #lab-head .title { color: var(--purple); font-weight: 600; }
            #lab-body { flex: 1; display: flex; min-height: 0; }
            #lab-steps {
                width: 210px;
                flex-shrink: 0;
                border-right: 1px solid var(--line);
                overflow: auto;
                padding: 8px;
            }
            .lab-step-row {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 6px 8px;
                border-radius: 5px;
                cursor: pointer;
                color: var(--text-dim);
            }
            .lab-step-row:hover { background: #1d2027; }
            .lab-step-row.active { background: #241d38; color: var(--purple); }
            .lab-step-row .edited-flag { margin-left: auto; color: var(--amber); }
            #lab-editor {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
                padding: 10px;
                gap: 8px;
                overflow: auto;
            }
            #lab-editor .ed-label {
                color: var(--text-faint);
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #lab-editor textarea {
                width: 100%;
                font-size: 11px;
                line-height: 1.5;
                resize: vertical;
                tab-size: 2;
            }
            #lab-sys { min-height: 130px; }
            #lab-usr { min-height: 260px; }
            #lab-vars { display: flex; flex-wrap: wrap; gap: 5px; }
            .var-chip {
                font-size: 10px;
                color: var(--purple);
                border: 1px solid #5a4a8a;
                border-radius: 3px;
                padding: 1px 6px;
                cursor: pointer;
                user-select: none;
            }
            .var-chip:hover { background: #241d38; }
            .var-chip.dim { opacity: 0.45; border-style: dashed; }
            .var-chip.dim:hover { opacity: 0.85; }
            #lab-right {
                width: 460px;
                flex-shrink: 0;
                border-left: 1px solid var(--line);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            #lab-right .pane-head {
                padding: 8px 12px;
                border-bottom: 1px solid var(--line-2);
                color: var(--text-dim);
                display: flex;
                align-items: center;
                gap: 8px;
                flex-shrink: 0;
            }
            #lab-events { flex: 1; overflow: auto; padding: 8px; }
            .ev-cell-group { margin-bottom: 10px; }
            .ev-cell-group > .g-head {
                color: var(--accent);
                font-size: 11px;
                padding: 2px 4px;
                display: flex;
                gap: 8px;
                align-items: center;
            }
            .sim-live-tag {
                font-size: 10px;
                color: var(--purple);
                border: 1px dashed #5a4a8a;
                border-radius: 3px;
                padding: 0 6px;
                margin-left: auto;
            }
            .ev-row {
                border: 1px solid var(--line-2);
                border-radius: 6px;
                padding: 6px 8px;
                margin: 5px 0;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .ev-row.selected { border-color: #5a4a8a; background: #1b1626; }
            .ev-row .r1 { display: flex; align-items: center; gap: 8px; }
            .ev-row .r1 .pick { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; min-width: 0; }
            .ev-row .node-tag { color: var(--text); font-weight: 600; }
            .ev-row .idx { color: var(--text-faint); font-size: 10px; }
            .ev-scene-btn { font-size: 10px; padding: 1px 7px; flex-shrink: 0; }
            .ev-row .preview {
                color: var(--text-faint);
                font-size: 10px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .ev-test {
                border-top: 1px dashed var(--line-2);
                padding-top: 5px;
                font-size: 11px;
            }
            .ev-test .t-status { color: var(--amber); }
            .ev-test .t-status.ok { color: var(--green); }
            .ev-test .t-status.err { color: var(--red); }
            .ev-test pre {
                background: #0c0d10;
                border-radius: 4px;
                padding: 6px;
                max-height: 160px;
                overflow: auto;
                margin-top: 4px;
            }
            .ev-test .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
            .ev-test .cmp .lab {
                color: var(--text-faint);
                font-size: 10px;
                margin-bottom: 2px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            #lab-actions {
                border-top: 1px solid var(--line);
                padding: 9px 12px;
                display: flex;
                gap: 8px;
                align-items: center;
                flex-shrink: 0;
                flex-wrap: wrap;
            }
            #lab-actions .count { color: var(--text-faint); margin-right: auto; }

            /* ---------- review canvas ---------- */
            #review {
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 85; /* above the lab (80), below the scene overlay (90) */
                display: none;
                flex-direction: column;
            }
            #review.open { display: flex; }
            /* Side-by-side 3D compare (previous result vs current). Sits above
               the review canvas it's launched from. */
            #compare {
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 95;
                display: none;
                flex-direction: column;
            }
            #compare.open { display: flex; }
            #compare-head {
                height: 46px;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 12px;
                background: var(--panel-2);
                border-bottom: 1px solid var(--line);
                flex-shrink: 0;
            }
            #compare-head .title { color: var(--purple); font-weight: 600; }
            #compare-head .cmp-link { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
            #compare-body { flex: 1; display: flex; min-height: 0; }
            .cmp-col { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
            .cmp-col:last-child { border-right: 0; }
            .cmp-col-head { padding: 5px 12px; background: #14151a; border-bottom: 1px solid var(--line-2); font-size: 11px; letter-spacing: 0.04em; }
            .cmp-col-head.prev { color: var(--text-faint); }
            .cmp-col-head.cur { color: var(--accent); }
            .cmp-host { flex: 1; position: relative; min-height: 0; }
            #compare-text {
                flex-shrink: 0;
                max-height: 40vh;
                overflow: auto;
                border-top: 1px solid var(--line);
                background: var(--panel);
                padding: 10px 12px;
                display: none;
            }
            #compare-text.open { display: block; }
            #compare-text .ct-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            #compare-text .ct-sec { margin-bottom: 10px; }
            #compare-text .ct-h { color: var(--text-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
            #review-head {
                height: 46px;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 12px;
                background: var(--panel-2);
                border-bottom: 1px solid var(--line);
                flex-shrink: 0;
            }
            #review-head .title { color: var(--purple); font-weight: 600; }
            #review-controls {
                margin-left: auto;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }
            #review-controls .rc-label {
                color: var(--text-faint);
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }
            #review-cols { padding: 3px 6px; font-size: 11px; }
            #review-sections { display: flex; gap: 4px; }
            .rc-pill {
                font-size: 10px;
                padding: 2px 9px;
                border: 1px solid var(--line);
                border-radius: 4px;
                color: var(--text-faint);
                cursor: pointer;
                user-select: none;
            }
            .rc-pill:hover { border-color: var(--accent-line); }
            .rc-pill.on { color: var(--accent); border-color: var(--accent-line); background: #16222e; }
            .rc-pill.rc-3d { margin-left: 8px; }
            .rc-pill.rc-3d.on { color: var(--purple); border-color: var(--purple); background: #221a2e; }
            #review-test-all { font-size: 11px; padding: 4px 10px; }
            #review-grid {
                flex: 1;
                overflow: auto;
                padding: 14px;
                display: grid;
                gap: 12px;
                align-items: start;
                grid-auto-rows: min-content;
            }
            .rv-card {
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--panel);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .rv-ab { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            /* 3D-grid mode: each card body becomes a live scene canvas. */
            .rv-3d { position: relative; height: 300px; background: #0c0d10; border-radius: 6px; overflow: hidden; }
            .rv-3d canvas { display: block; }
            .rv-ab .ab-h { color: var(--text-faint); font-size: 10px; margin-bottom: 2px; }
            .rv-ab .ab-edited .ab-h { color: var(--purple); }
            .rv-changed { color: var(--amber); }
            .rv-unchanged { color: var(--text-faint); }
            .rv-card .rv-head {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
                background: var(--panel-2);
                border-bottom: 1px solid var(--line-2);
            }
            .rv-card .rv-slot { font-weight: 600; color: var(--text); }
            .rv-card .rv-meta { color: var(--text-faint); font-size: 10px; }
            /* Sections stack vertically so each (input / output / system /
               reasoning) spans the card's full width — the visible set is
               chosen globally, and the outer grid's column count controls
               density, so the text you care about fills the available room. */
            .rv-card .rv-body {
                padding: 8px 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .rv-card .rv-sec .lab {
                color: var(--text-faint);
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                margin-bottom: 3px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .rv-card .rv-sec pre {
                background: #0c0d10;
                border: 1px solid var(--line-2);
                border-radius: 5px;
                padding: 7px;
                max-height: 220px;
                overflow: auto;
            }
            .rv-card.err { border-color: #7a3f3f; }
            .rv-card .rv-loading { color: var(--text-faint); padding: 14px; }

            /* sim chips on lab cells */
            .sim-row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 5px 8px;
                border: 1px solid var(--line-2);
                border-radius: 6px;
                margin: 5px 0;
            }
            .sim-row .cell-name { font-weight: 600; cursor: pointer; }
            .sim-row .cell-name:hover { color: var(--accent); }
            .sim-row .step-line { color: var(--text-faint); font-size: 10px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .sim-row button { font-size: 10px; padding: 2px 8px; }

            /* ---------- modals + toasts ---------- */
            #modal-root .modal-back {
                position: fixed;
                inset: 0;
                background: rgba(8, 9, 12, 0.82);
                backdrop-filter: blur(4px);
                z-index: 120;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .modal-panel {
                width: min(460px, 92vw);
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                overflow: hidden;
            }
            .modal-panel header {
                display: flex;
                align-items: center;
                padding: 10px 14px;
                background: var(--panel-2);
                border-bottom: 1px solid var(--line);
                color: var(--accent);
                font-weight: 600;
            }
            .modal-panel header .x {
                margin-left: auto;
                cursor: pointer;
                color: var(--text-faint);
                font-size: 18px;
                line-height: 1;
            }
            .modal-panel header .x:hover { color: var(--text); }
            .modal-panel .m-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
            .modal-panel .m-field { display: flex; flex-direction: column; gap: 4px; }
            .modal-panel .m-field > span {
                color: var(--text-dim);
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }
            .modal-panel .m-hint { color: var(--text-faint); font-size: 11px; }
            .modal-panel .m-error { color: var(--red); font-size: 11px; min-height: 14px; }
            .modal-panel footer {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
                padding: 10px 14px;
                background: var(--panel-2);
                border-top: 1px solid var(--line);
            }
            .check-grid { display: flex; flex-direction: column; gap: 3px; max-height: 40vh; overflow: auto; }
            .check-grid label { display: flex; gap: 8px; align-items: center; color: var(--text-dim); cursor: pointer; }

            #toast-root {
                position: fixed;
                bottom: 14px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 200;
                display: flex;
                flex-direction: column;
                gap: 6px;
                align-items: center;
            }
            .toast {
                background: var(--panel-2);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 7px 14px;
                color: var(--text-dim);
                max-width: 70vw;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .toast.err { border-color: #7a3f3f; color: var(--red); }
            .toast.ok { border-color: var(--green-line); color: var(--green); }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "/vendor/three/build/three.module.js",
                    "three/addons/": "/vendor/three/examples/jsm/"
                }
            }
        </script>

    <body>
        <div id="topbar">
            <span class="brand">starshot</span>
            <select id="run-picker" title="Switch the active run"></select>
            <button id="btn-new-run" title="Create a new run from a prompt version">+ new run</button>
            <button id="btn-start-cells" title="Start model × slot cells on this run">start cells…</button>
            <button id="btn-reset-all" class="danger" title="Wipe every started cell on this run back to idle (deletes their events + meshes). Nothing is restarted.">reset all</button>
            <span class="sep"></span>
            <button id="btn-lab" class="primary" title="Edit a prompt template, test it against logged events, and simulate downstream">modify prompts</button>
            <button id="btn-step-all" style="display:none" title="Advance every waiting slot by exactly one step">step all</button>
            <button id="btn-board-view" title="Toggle between the status cards and a grid of live 3D scenes for every active run">scenes ▦</button>
            <span id="status-text"></span>
        </div>
        <div id="board"><div id="board-plane"><div id="board-grid"></div></div></div>
        <div id="board-scenes"></div>
        <button id="scene-add-fab" title="add a slot's 3D scene to the grid">+ add slot</button>
        <div id="obs-drawer">
            <div id="obs-drawer-head">
                <span class="title" id="obs-drawer-title"></span>
                <span class="muted" id="obs-drawer-sub"></span>
                <button id="obs-drawer-close" style="margin-left:auto">close ✕</button>
            </div>
            <div id="obs-drawer-body"></div>
        </div>
        <div id="overlay">
            <div id="overlay-head">
                <button id="overlay-close" title="Back to the board (Esc)">← board</button>
                <span class="title" id="overlay-title"></span>
                <span class="crumbs" id="overlay-crumbs"></span>
                <span class="sep"></span>
                <span class="dot idle" id="overlay-dot"></span>
                <span id="overlay-status" class="muted"></span>
                <span style="margin-left:auto"></span>
                <button id="overlay-action"></button>
                <button id="overlay-reset" class="danger">reset</button>
            </div>
            <div id="overlay-body">
                <div id="canvas-host">
                    <div id="viewer-toggles">
                        <button data-toggle="bboxes">bboxes</button>
                        <button data-toggle="meshes">meshes</button>
                        <button data-toggle="frames">frames</button>
                        <button data-toggle="grid">grid</button>
                        <button id="btn-refit">refit</button>
                    </div>
                </div>
                <div id="obsdock-resizer" title="drag to resize the observability panel"></div>
                <div id="obsdock" style="position:relative">
                    <div id="obsdock-head">
                        <span>observability</span>
                        <span id="obs-count" class="muted"></span>
                    </div>
                    <div id="obs-pinned"></div>
                    <div id="obs-body"></div>
                    <div id="obs-log">
                        <div id="obs-log-head">
                            <span class="caret">▸</span>
                            <span>log</span>
                            <span id="obs-log-counts" class="muted"></span>
                        </div>
                        <div id="obs-log-body"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="lab">
            <div id="lab-head">
                <button id="lab-close">← board</button>
                <span class="title">prompt lab</span>
                <span class="muted" id="lab-run"></span>
                <span style="margin-left:auto"></span>
                <button id="lab-apply" class="primary" title="Write the edited templates into THIS run's snapshot and optionally re-run a step across all slots — the in-place iteration loop">apply to run…</button>
                <button id="lab-save-version">save to new version</button>
                <button id="lab-save-run">save to new run</button>
            </div>
            <div id="lab-body">
                <div id="lab-steps"></div>
                <div id="lab-editor">
                    <div class="ed-label">variables <span class="muted">(click to insert — they render at call time; scene context stays a token here)</span></div>
                    <div id="lab-vars"></div>
                    <div class="ed-label" id="lab-sys-label">system template</div>
                    <textarea id="lab-sys" spellcheck="false"></textarea>
                    <div class="ed-label" id="lab-usr-label">user template</div>
                    <textarea id="lab-usr" spellcheck="false"></textarea>
                </div>
                <div id="lab-right">
                    <div class="pane-head">
                        <span id="lab-right-title">events that ran this step</span>
                        <span id="lab-ev-count" class="muted"></span>
                        <button id="lab-ev-review" style="margin-left:auto;font-size:10px;padding:2px 8px" title="Open a side-by-side review canvas of every event's input + output">review all ▦</button>
                        <button id="lab-ev-refresh" style="font-size:10px;padding:2px 8px">refresh</button>
                        <button id="lab-step-all" style="display:none;font-size:10px;padding:2px 8px" title="Advance every stepped cell one LLM call, then follow it in the lab">step all</button>
                    </div>
                    <div id="lab-events"></div>
                    <div id="lab-actions">
                        <span class="count" id="lab-sel-count">0 selected</span>
                        <button id="lab-test" class="primary">test on selected</button>
                        <button id="lab-simulate">simulate downstream</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="review">
            <div id="review-head">
                <button id="review-close">← prompt lab</button>
                <span class="title">review · <span id="review-step"></span></span>
                <span class="muted" id="review-count"></span>
                <div id="review-controls">
                    <span class="rc-label">show</span>
                    <div id="review-sections"></div>
                    <span class="rc-label">cols</span>
                    <select id="review-cols" title="how many cards per row">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                    <button id="review-step-all" style="display:none" title="Advance every stepped cell one LLM call, then follow it here">step all</button>
                    <button id="review-test-all" class="primary" title="Run the current prompt edit against every event here and show previous vs current output">test edit on all</button>
                    <span class="muted" id="review-test-summary"></span>
                </div>
            </div>
            <div id="review-grid"></div>
        </div>
        <div id="compare">
            <div id="compare-head">
                <button id="compare-close">← review</button>
                <span class="title">compare · <span id="compare-title"></span></span>
                <span class="muted" id="compare-sub"></span>
                <span style="margin-left:auto"></span>
                <button id="compare-sync" title="Align the previous view to the current view">sync views ⟳</button>
                <label class="cmp-link" title="Move both cameras together"><input id="compare-link" type="checkbox" checked /> link cameras</label>
                <button id="compare-text-toggle" title="Show input diff + outputs">text ▾</button>
            </div>
            <div id="compare-body">
